id: appointment-runtime
name: Appointments
version: 0.1.1
hosting: runtime
description: Services, staff, availability, and bookings as a native Qefro business
  application
category: scheduling
tags:
- appointments
- booking
- runtime
channels:
- widget
- whatsapp
entities:
- service
- staff_member
- availability_slot
- appointment
flows:
- create-appointment
- reschedule-appointment
- cancel-appointment
- lookup-appointment
events:
- appointment.created
- appointment.updated
- appointment.cancelled
- booking.created
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: book_appointment
  workflow: create-appointment
  input_variable: appointment_input
  match:
    intents:
    - book an appointment
    - schedule an appointment
    - make a booking
    confirmation:
      reply_signals:
      - appointment
      - booked
      required_slots:
      - service_name
      - date
  confirmation_message: Appointment booked for {{guest_name}} on {{date}}.
- id: reschedule_appointment
  workflow: reschedule-appointment
  input_variable: reschedule_input
  match:
    intents:
    - reschedule my appointment
    - move my booking
    confirmation:
      reply_signals:
      - rescheduled
      required_slots:
      - id
      - date
  confirmation_message: Appointment {{id}} rescheduled to {{date}}.
- id: cancel_appointment
  workflow: cancel-appointment
  input_variable: cancel_input
  match:
    intents:
    - cancel my appointment
    - cancel the booking
    confirmation:
      reply_signals:
      - cancelled
      required_slots:
      - id
  confirmation_message: Appointment {{id}} cancelled.
- id: lookup_appointment
  workflow: lookup-appointment
  input_variable: lookup_input
  match:
    intents:
    - find my appointment
    - appointment status
    confirmation:
      reply_signals:
      - appointment
      required_slots:
      - id
  confirmation_message: Here is appointment {{id}}.
conversation_slots:
- id: guest_name
  labels:
  - guest
  - name
  - customer
  kind: person_name
  identity: person_name
- id: service_name
  labels:
  - service
  - treatment
  - session type
  kind: string
- id: staff_name
  labels:
  - staff
  - with
  - practitioner
  kind: string
- id: date
  labels:
  - date
  - tomorrow
  kind: date
- id: time
  labels:
  - time
  kind: time
  chip_prefix: time
- id: id
  labels:
  - appointment
  - booking id
  kind: string
- id: status
  labels:
  - status
  - cancelled
  kind: string
ui:
  name: Appointments
