id: appointment
scope: customer
name: Appointment
description: "Customer booking bound to Person"
allocate_code:
  prefix: A-
  start: 1001
fields:
  - name: guest_name
    type: string
    required: true
  - name: service_id
    type: relation
    ref_entity: service
  - name: service_name
    type: string
    required: true
  - name: staff_id
    type: relation
    ref_entity: staff_member
  - name: staff_name
    type: string
  - name: scheduled_at
    type: datetime
  - name: date
    type: date
    required: true
  - name: time
    type: string
  - name: status
    type: enum
    enum_values:
      - scheduled
      - confirmed
      - completed
      - cancelled
      - no_show
  - name: person_id
    type: person
    ref_entity: person
    description: "Existing Qefro Person identity (never an app-local CRM)"
status_events:
  confirmed: appointment.confirmed
  cancelled: appointment.cancelled
  completed: appointment.completed
availability:
  booking:
    datetime_field: scheduled_at
  capacity:
    mode: exclusive
    resource:
      field: staff_id
