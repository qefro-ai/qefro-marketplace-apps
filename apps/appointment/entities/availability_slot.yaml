id: availability_slot
name: "Availability slot"
description: "Open window for bookings"
fields:
  - name: staff_name
    type: string
    required: true
  - name: date
    type: date
    required: true
  - name: start_time
    type: string
  - name: end_time
    type: string
  - name: status
    type: enum
    enum_values:
      - open
      - held
      - booked
