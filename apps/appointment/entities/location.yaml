id: location
name: Location
description: "Service location or branch"
allocate_code:
  prefix: LOC-
  start: 1001
fields:
  - name: name
    type: string
    required: true
  - name: address
    type: string
    required: true
  - name: phone
    type: phone
  - name: status
    type: enum
    enum_values:
      - active
      - inactive
