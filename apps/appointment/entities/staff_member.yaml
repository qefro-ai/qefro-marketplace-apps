id: staff_member
name: "Staff member"
description: "Person who delivers a service"
fields:
  - name: name
    type: string
    required: true
  - name: role
    type: string
  - name: user_id
    type: uuid
    description: "Reference to the authenticated tenant member (Qefro user)"
  - name: person_id
    type: person
    ref_entity: person
    description: "Staff Person identity when the teammate is also a Qefro user (legacy reference)"
