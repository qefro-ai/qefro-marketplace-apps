id: appointment
name: Appointments
version: 1.3.2
hosting: runtime
description: Services, staff, availability, and bookings as a native Qefro business
  application
category: scheduling
tags:
- appointments
- booking
- runtime
channels:
- widget
- whatsapp
entities:
- service
- staff_member
- availability_slot
- appointment
flows:
- create-appointment
- reschedule-appointment
- cancel-appointment
- lookup-appointment
- create-service
- create-staff-member
- create-availability-slot
events:
- appointment.created
- appointment.updated
- appointment.cancelled
- appointment.confirmed
- appointment.completed
- appointment.no_show
- booking.created
- service.created
- staff_member.created
- availability_slot.booked

followup_sequences:
- id: appointment_confirmation_followup
  name: Appointment confirmation follow-up
  description: Follow up with customers who haven't confirmed their appointment until they confirm or reply.
  channel: whatsapp
  steps:
  - id: step_1
    template: appointment_followup_1
    delay:
      unit: hours
      value: 24
  - id: step_2
    template: appointment_followup_2
    delay:
      unit: days
      value: 3
  - id: step_3
    template: appointment_followup_3
    delay:
      unit: days
      value: 7
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
settings:
- key: timezone
  type: string
  default: Asia/Kolkata
  description: IANA timezone for appointment slots
- key: duration_minutes
  type: number
  default: 30
  description: Appointment duration in minutes
- key: start_time
  type: string
  default: "09:00"
  description: Opening time (HH:MM, 24-hour)
- key: end_time
  type: string
  default: "18:00"
  description: Closing time (HH:MM, 24-hour)
- key: closed_days
  type: string
  default: sunday
  description: Comma-separated weekdays the office is closed
- key: date_window_days
  type: number
  default: 14
  description: How many days ahead to offer appointment slots
- key: blocking_statuses
  type: string
  default: scheduled,confirmed
  description: Appointment statuses that occupy a staff slot
triggers:
- id: book_appointment
  workflow: create-appointment
  input_variable: appointment_input
  match:
    intents:
    - book an appointment
    - schedule an appointment
    - make a booking
    confirmation:
      reply_signals:
      - appointment
      - booked
      required_slots:
      - service_name
      - date
  confirmation_message: Appointment booked for {{guest_name}} on {{date}}.
- id: reschedule_appointment
  workflow: reschedule-appointment
  input_variable: reschedule_input
  match:
    intents:
    - reschedule my appointment
    - move my booking
    confirmation:
      reply_signals:
      - rescheduled
      required_slots:
      - id
      - date
  confirmation_message: Appointment for {{person_name}} rescheduled to {{date}}.
- id: cancel_appointment
  workflow: cancel-appointment
  input_variable: cancel_input
  match:
    intents:
    - cancel my appointment
    - cancel the booking
    confirmation:
      reply_signals:
      - cancelled
      required_slots:
      - id
  confirmation_message: Appointment for {{person_name}} cancelled.
- id: lookup_appointment
  workflow: lookup-appointment
  input_variable: lookup_input
  match:
    intents:
    - find my appointment
    - appointment status
    confirmation:
      reply_signals:
      - appointment
      required_slots:
      - id
  confirmation_message: Here is appointment for {{person_name}}.
conversation_slots:
- id: guest_name
  labels:
  - guest
  - name
  - customer
  kind: person_name
  identity: person_name
- id: service_name
  labels:
  - service
  - treatment
  - session type
  kind: string
- id: staff_name
  labels:
  - staff
  - with
  - practitioner
  kind: string
- id: name
  labels:
  - name
  - full name
  kind: person_name
  identity: person_name
- id: date
  labels:
  - date
  - tomorrow
  kind: date
- id: time
  labels:
  - time
  kind: time
  chip_prefix: time
- id: role
  labels:
  - role
  - position
  kind: string
- id: email
  labels:
  - email
  - e-mail
  kind: email
- id: phone
  labels:
  - phone
  - mobile
  - number
  kind: phone
- id: duration_minutes
  labels:
  - duration
  - minutes
  kind: integer
- id: price
  labels:
  - price
  - cost
  - fee
  kind: float
- id: start_time
  labels:
  - start
  - from
  kind: string
- id: end_time
  labels:
  - end
  - to
  kind: string
- id: status
  labels:
  - status
  - cancelled
  kind: string
- id: id
  labels:
  - appointment
  - booking id
  kind: string
ui:
  name: Appointments
