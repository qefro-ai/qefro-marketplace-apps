- id: appointment_form
  type: form
  title: New appointment
  options:
    fields:
    - name: guest_name
      label: Guest name
      type: text
      required: true
    - name: service_name
      label: Service
      type: text
      required: true
    - name: date
      label: Date
      type: date
      required: true
    - name: time
      label: Time
      type: time
      required: false
    submit_label: Book
    action:
      trigger: create-appointment
- id: service_form
  type: form
  title: New service
  options:
    fields:
    - name: name
      label: Service name
      type: text
      required: true
    - name: duration_minutes
      label: Duration (minutes)
      type: number
      required: true
    - name: price
      label: Price
      type: number
      required: false
    submit_label: Add service
    action:
      trigger: create-service
- id: staff_form
  type: form
  title: New staff member
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: role
      label: Role
      type: text
      required: false
    submit_label: Add staff
    action:
      trigger: create-staff-member
- id: customer_form
  type: form
  title: New customer
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: phone
      label: Phone
      type: text
      required: false
    - name: email
      label: Email
      type: text
      required: false
    submit_label: Add customer
    action:
      trigger: create-customer
- id: availability_form
  type: form
  title: New availability slot
  options:
    fields:
    - name: staff_name
      label: Staff member
      type: text
      required: true
    - name: date
      label: Date
      type: date
      required: true
    - name: start_time
      label: Start time
      type: text
      required: true
    - name: end_time
      label: End time
      type: text
      required: true
    submit_label: Open slot
    action:
      trigger: create-availability-slot
- id: appointments_status
  type: status
  title: Appointments
  source: appointments
  options:
    rows_path: items
    status_field: status
    label_field: guest_name
    empty_title: Nothing yet
- id: appointments_table
  type: table
  title: Appointments
  source: appointments
  options:
    rows_path: items
    empty_title: No appointments yet
    columns:
    - key: guest_name
      header: Guest
    - key: service_name
      header: Service
    - key: date
      header: Date
    - key: status
      header: Status
- id: services_table
  type: table
  title: Services
  source: services
  options:
    rows_path: items
    empty_title: No services yet
    columns:
    - key: name
      header: Name
    - key: duration_minutes
      header: Minutes
    - key: price
      header: Price
    - key: status
      header: Status
- id: staff_table
  type: table
  title: Staff
  source: staff
  options:
    rows_path: items
    empty_title: No staff yet
    columns:
    - key: name
      header: Name
    - key: role
      header: Role
    - key: status
      header: Status
- id: slots_table
  type: table
  title: Availability
  source: slots
  options:
    rows_path: items
    empty_title: No availability yet
    columns:
    - key: staff_name
      header: Staff
    - key: date
      header: Date
    - key: status
      header: Status
- id: customers_table
  type: table
  title: Customers
  source: customers
  options:
    rows_path: items
    empty_title: No customers yet
    columns:
    - key: name
      header: Name
    - key: phone
      header: Phone
    - key: email
      header: Email
    - key: status
      header: Status
- id: locations_table
  type: table
  title: Locations
  source: locations
  options:
    rows_path: items
    empty_title: No locations yet
    columns:
    - key: name
      header: Name
    - key: address
      header: Address
    - key: phone
      header: Phone
    - key: status
      header: Status
- id: availability_table
  type: table
  title: Availability
  source: availability
  options:
    rows_path: items
    empty_title: No availability yet
    columns:
    - key: staff_name
      header: Staff
    - key: date
      header: Date
    - key: start_time
      header: Start
    - key: end_time
      header: End
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Appointments
  options:
    content: Appointments, services, and availability — open a list and tap New to
      add records.
- id: metric_appointment
  type: metric
  title: Appointments
  source: appointments
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: appointments
- id: metric_service
  type: metric
  title: Services
  source: services
  options:
    aggregate: count
    rows_path: items
    label: Services
    navigate_to: services
- id: metric_staff
  type: metric
  title: Staff
  source: staff
  options:
    aggregate: count
    rows_path: items
    label: Staff
    navigate_to: staff
- id: metric_availability
  type: metric
  title: Slots
  source: availability
  options:
    aggregate: count
    rows_path: items
    label: Slots
    navigate_to: availability
- id: appointment_dash_status
  type: status
  title: Appointments status
  source: appointments
  options:
    rows_path: items
    status_field: status
    label_field: patient_name
    empty_title: No appointments yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: appointments
    action_label: View all
- id: appointment_dash_table
  type: table
  title: Recent Appointments
  source: appointments
  options:
    rows_path: items
    limit: 8
    empty_title: No appointments yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: appointments
    action_label: View all
    columns:
    - key: guest_name
      header: Guest Name
    - key: service_name
      header: Service Name
    - key: staff_name
      header: Staff Name
    - key: date
      header: Date
    - key: time
      header: Time
