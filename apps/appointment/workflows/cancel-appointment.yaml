id: cancel-appointment
name: "Cancel appointment"
description: "Mark an appointment cancelled through Qefro Runtime"
trigger:
  type: conversation
constants:
  cancelled: cancelled
steps:
  - id: list_appointments
    type: tool
    tool: entity.appointment.list
    execution: runtime
    output: appointments
    input_map:
      filter.status: $literal:scheduled
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "❌ Which appointment would you like to cancel?"
    choices_from: appointments
    title_field: person_name
    value_field: id
    chip_prefix: appointment
  - id: run
    type: tool
    tool: entity.appointment.update
    execution: runtime
    input_map:
      id: id
      status: $constants.cancelled
  - id: confirm
    type: message
    message: "❌ Appointment {{id}} cancelled."
  - id: done
    type: complete
