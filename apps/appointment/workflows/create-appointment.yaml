id: create-appointment
name: "Create appointment"
description: "Book an appointment through Qefro Runtime"
trigger:
  type: conversation
steps:
  - id: list_services
    type: tool
    tool: entity.service.list
    execution: runtime
    output: services
    input_map:
      filter.status: $literal:active
      limit: $literal:20
  - id: ask_service
    type: ask
    field: service_id
    message: "📅 Which service should we book?"
    choices_from: services
    title_field: name
    value_field: id
    chip_prefix: service
  - id: get_service
    type: tool
    tool: entity.service.get
    execution: runtime
    output: service
    input_map:
      id: service_id
  - id: list_staff
    type: tool
    tool: entity.staff_member.list
    execution: runtime
    output: staff
    input_map:
      limit: $literal:20
  - id: ask_staff
    type: ask
    field: staff_id
    message: "👤 Which staff member?"
    choices_from: staff
    title_field: name
    value_field: id
    chip_prefix: staff
  - id: get_staff
    type: tool
    tool: entity.staff_member.get
    execution: runtime
    output: staff_member
    input_map:
      id: staff_id
  - id: list_dates
    type: tool
    tool: entity.appointment.availability
    execution: runtime
    output: available_dates
    input_map:
      kind: $literal:dates
      staff_id: staff_id
  - id: ask_date
    type: ask
    field: date
    message: "📅 Choose a date"
    choices_from: available_dates
    title_field: label
    value_field: value
    chip_prefix: date
  - id: list_slots
    type: tool
    tool: entity.appointment.availability
    execution: runtime
    output: available_slots
    input_map:
      kind: $literal:slots
      date: date
      staff_id: staff_id
  - id: ask_time
    type: ask
    field: time
    message: "⏰ Choose a time"
    choices_from: available_slots
    title_field: label
    value_field: time
    chip_prefix: time
  - id: validate_slot
    type: tool
    tool: entity.appointment.availability
    execution: runtime
    output: slot_check
    input_map:
      kind: $literal:validate
      date: date
      time: time
      staff_id: staff_id
  - id: ask_guest_name
    type: ask
    field: guest_name
    message: "👤 What name should the appointment be under?"
  - id: run
    type: tool
    tool: entity.appointment.create
    execution: runtime
    input_map:
      guest_name: guest_name
      service_id: service_id
      service_name: service.name
      staff_id: staff_id
      staff_name: staff_member.name
      date: date
      time: time
      scheduled_at: scheduled_at
      status: $literal:scheduled
  - id: confirm
    type: message
    message: "✅ Appointment booked for {{guest_name}} on {{date}} at {{time}}."
  - id: done
    type: complete
