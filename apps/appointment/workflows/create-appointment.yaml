id: create-appointment
name: "Create appointment"
description: "Book an appointment through Qefro Runtime"
trigger:
  type: conversation
steps:
  - id: ask_service_name
    type: ask
    field: service_name
    message: "📅 Which service should we book?"
  - id: ask_date
    type: ask
    field: date
    message: "📅 Which date?"
  - id: ask_guest_name
    type: ask
    field: guest_name
    message: "👤 What name should the appointment be under?"
  - id: run
    type: tool
    tool: entity.appointment.create
    execution: runtime
    input_map:
      guest_name: guest_name
      service_name: service_name
      date: date
      time: time
      staff_name: staff_name
      status: $literal:scheduled
  - id: confirm
    type: message
    message: "✅ Appointment booked for {{guest_name}} on {{date}}."
  - id: done
    type: complete
