id: create-availability-slot
name: "Open availability"
description: "Create an availability slot"
trigger:
  type: conversation
steps:
  - id: ask_staff
    type: ask
    field: staff_name
    message: "👤 Which staff member?"
  - id: ask_date
    type: ask
    field: date
    message: "📅 Which date?"
  - id: ask_start
    type: ask
    field: start_time
    message: "🕐 Start time?"
  - id: ask_end
    type: ask
    field: end_time
    message: "🕐 End time?"
  - id: run
    type: tool
    tool: entity.availability_slot.create
    execution: runtime
    input_map:
      staff_name: staff_name
      date: date
      start_time: start_time
      end_time: end_time
      status: $literal:open
  - id: confirm
    type: message
    message: "✅ Slot opened for {{staff_name}} on {{date}} {{start_time}}–{{end_time}}."
  - id: done
    type: complete
