id: reschedule-appointment
name: "Reschedule appointment"
description: "Update appointment date/time through Qefro Runtime"
surfaces:
- customer
trigger:
  type: conversation
steps:
  - id: list_appointments
    type: tool
    tool: entity.appointment.list
    execution: runtime
    output: appointments
    input_map:
      filter.status: $literal:scheduled
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "🔄 Which appointment would you like to reschedule?"
    empty_message: "You have no upcoming appointments to reschedule."
    choices_from: appointments
    title_field: guest_name
    value_field: id
    chip_prefix: appointment
  - id: get_appointment
    type: tool
    tool: entity.appointment.get
    execution: runtime
    output: appointment
    input_map:
      id: id
  - id: list_dates
    type: tool
    tool: entity.appointment.availability
    execution: runtime
    output: available_dates
    input_map:
      kind: $literal:dates
      staff_id: appointment.staff_id
  - id: ask_date
    type: ask
    field: date
    message: "📅 Choose a date"
    empty_message: "There are no open dates in the booking window right now."
    choices_from: available_dates
    title_field: label
    value_field: value
    chip_prefix: date
  - id: list_slots
    type: tool
    tool: entity.appointment.availability
    execution: runtime
    output: available_slots
    input_map:
      kind: $literal:slots
      date: date
      staff_id: appointment.staff_id
  - id: ask_time
    type: ask
    field: time
    message: "⏰ Choose a time"
    empty_message: "There are no open slots on that date."
    choices_from: available_slots
    title_field: label
    value_field: time
    chip_prefix: time
  - id: validate_slot
    type: tool
    tool: entity.appointment.availability
    execution: runtime
    output: slot_check
    input_map:
      kind: $literal:validate
      date: date
      time: time
      staff_id: appointment.staff_id
  - id: run
    type: tool
    tool: entity.appointment.update
    execution: runtime
    input_map:
      id: id
      date: date
      time: time
      scheduled_at: scheduled_at
  - id: confirm
    type: message
    message: "🔄 Appointment for {{guest_name}} rescheduled to {{date}} at {{time}}."
  - id: done
    type: complete
