id: payment_allocation
name: Payment allocation
description: How much of a payment goes to one invoice. One receipt can cover several invoices.
allocate_code:
  prefix: ALC-
  start: 1001
concurrency: optimistic
fields:
- name: payment_id
  type: relation
  ref_entity: payment
  required: true
- name: invoice_id
  type: relation
  ref_entity: invoice
  required: true
- name: amount
  type: float
  required: true
relation_caps:
  - field: amount
    relation: payment_id
    parent_field: amount
