  - sku
  - product code
  kind: string
- id: item_type
  labels:
  - item type
  - product
  - service
  kind: string
- id: selling_price
  labels:
  - selling price
  - price
  kind: string
- id: unit
  labels:
  - unit
  kind: string
- id: tax_rate
  labels:
  - tax
  - tax rate
  kind: string
- id: total_amount
  labels:
  - total
  - amount
  - invoice total
  kind: string
- id: amount
  labels:
  - amount
  - payment amount
  kind: string
- id: currency
  labels:
  - currency
  - INR
  - USD
  kind: string
- id: invoice_number
  labels:
  - invoice
  - invoice number
  - invoice code
  kind: string
- id: method
  labels:
  - payment method
  - method
  - cash
  - upi
  kind: string
- id: issue_date
  labels:
  - issue date
  - invoice date
  kind: date
- id: due_date
  labels:
  - due date
  - due
  kind: date
- id: payment_date
  labels:
  - payment date
  - paid on
  kind: date
- id: follow_up_date
  labels:
  - follow-up date
  - follow up date
  - Friday
  - next week
  kind: date
- id: notes
  labels:
  - notes
  - comment
  kind: string
- id: status
  labels:
  - status
  kind: string
- id: paid_amount
  labels:
  - paid
  - paid amount
  kind: string
- id: outstanding_amount
  labels:
  - outstanding
  - balance
  kind: string
- id: id
  labels:
