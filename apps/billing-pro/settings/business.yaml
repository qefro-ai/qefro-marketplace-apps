# Workspace billing defaults — not entity structure and not a scheduler.
# currency / default_tax_rate are consumed via field default_from_setting.
# payment_terms_days and follow_up_interval_days are staff defaults; the runtime
# does not compute due dates from them.
settings:
  currency:
    type: string
    required: true
    default: INR
    description: Currency you bill in (for example INR). New invoices and payments use this.
  invoice_prefix:
    type: string
    required: true
    default: INV
    description: Letters at the start of invoice numbers (INV becomes INV-1001).
  payment_terms_days:
    type: number
    required: true
    default: 30
    description: How many days after the invoice date until payment is due.
  default_tax_rate:
    type: number
    required: false
    default: 0
    description: Tax rate used when you create products and invoices (0 if you add tax yourself).
  follow_up_interval_days:
    type: number
    required: true
    default: 3
    description: Typical days to wait between payment reminders.
  tax.enabled:
    type: boolean
    required: false
    default: false
    description: Enable Global Tax Engine calculations for invoices and billing.
  tax.mode:
    type: string
    required: false
    default: manual
    description: "Tax calculation mode: automatic (rules-based) or manual (flat-rate)."
  tax.country:
    type: string
    required: false
    default: IN
    description: Two-letter ISO country code for tax jurisdiction.
  tax.regime:
    type: string
    required: false
    default: GST
    description: Tax regime identifier (e.g. GST, VAT, SALES_TAX).
  tax.registration_type:
    type: string
    required: false
    default: GSTIN
    description: Type of tax registration (e.g. GSTIN, VAT_NUMBER).
  tax.registration_number:
    type: string
    required: false
    default: ""
    description: Official tax registration / identification number.
  tax.price_mode:
    type: string
    required: false
    default: exclusive
    description: "Pricing tax treatment: inclusive or exclusive."
  tax.default_category:
    type: string
    required: false
    default: STANDARD
    description: Default item tax category (e.g. STANDARD, SERVICES, EXEMPT).
  tax.rounding:
    type: string
    required: false
    default: per_line
    description: "Tax rounding method: per_line or document."
  tax.manual_rate:
    type: number
    required: false
    default: 0
    description: Flat tax rate percentage when manual mode is active.
