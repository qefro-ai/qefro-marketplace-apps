# Workspace billing defaults — not entity structure and not a scheduler.
# currency / default_tax_rate are consumed via field default_from_setting.
# payment_terms_days and follow_up_interval_days are staff defaults; the runtime
# does not compute due dates from them.
settings:
  currency:
    type: string
    required: true
    default: INR
    description: Currency you bill in (for example INR). New invoices and payments use this.
  invoice_prefix:
    type: string
    required: true
    default: INV
    description: Letters at the start of invoice numbers (INV becomes INV-1001).
  payment_terms_days:
    type: number
    required: true
    default: 30
    description: How many days after the invoice date until payment is due.
  default_tax_rate:
    type: number
    required: false
    default: 0
    description: Tax rate used when you create products and invoices (0 if you add tax yourself).
  follow_up_interval_days:
    type: number
    required: true
    default: 3
    description: Typical days to wait between payment reminders.
