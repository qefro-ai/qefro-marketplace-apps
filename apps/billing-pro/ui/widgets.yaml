- id: intro
  type: markdown
  title: How this works
  options:
    content: |
      Create invoices, record payments, and follow up on unpaid bills. Open **How this works** in the sidebar for the full guide.

      **First-run checklist**

      1. Configure business currency
      2. Configure invoice settings (prefix, terms, tax, follow-up interval)
      3. Add or import products
      4. Connect WhatsApp
      5. Configure follow-up automation on Automations
      6. Create your first invoice
      7. Record a payment

      You're ready. Billing Pro will track outstanding payments and automatically follow up with customers.

      **Today:** unpaid and overdue on this dashboard → Follow-ups → record payments as they come in. Overdue invoices get a follow-up. WhatsApp reminders are set on Automations (this app does not send WhatsApp by itself).
