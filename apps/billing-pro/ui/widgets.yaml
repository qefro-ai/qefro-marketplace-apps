- id: guide_getting_started
  type: markdown
  title: Getting started
  options:
    content: |
      Billing Pro tracks invoices and unpaid bills. It is not accounting software and not a payment gateway — you record money you already received.

      **Install settings:** currency (INR), invoice prefix (INV), payment terms (days until due), default tax, follow-up interval.

      **First-run checklist**

      1. Configure business currency
      2. Configure invoice settings
      3. Add or import products
      4. Connect WhatsApp
      5. Configure follow-up automation
      6. Create your first invoice
      7. Record a payment

      You're ready. Billing Pro will track outstanding payments and automatically follow up with customers.

      **Daily:** morning Dashboard (unpaid / overdue) → Follow-ups → record payments → overdue bills get a follow-up → WhatsApp if Automations is on.
- id: guide_products
  type: markdown
  title: Products
  options:
    content: |
      Products are what you sell. Open **Products** → New. Enter name, SKU (unique), price. Optional: description, product vs service, unit, tax.

      Currency and tax default from settings. Edit anytime. To stop using a product, set Active to no — do not delete ones already on invoices.

      **Import:** Products → Import Data. Map name, SKU / product code, price.
- id: guide_invoices
  type: markdown
  title: Invoices
  options:
    content: |
      **Example:** 2 × Product A at ₹500 = ₹1,000.

      1. Invoices → New. Pick the customer (add them under Contacts if new).
      2. Set due date. Optional invoice number (or INV-1001 is assigned).
      3. Invoice items → New. Product A, quantity 2, unit price 500.
      4. Invoice total becomes ₹1,000.

      **Draft** is a working copy. **Issued** is waiting for payment. **Paid / partially paid / overdue** update when you record payments — you do not type “paid” to collect.

      Line prices are snapshotted. Changing the product later does not rewrite old invoices.
- id: guide_payments
  type: markdown
  title: Payments
  options:
    content: |
      A **payment** is money received. An **allocation** is how much of it applies to one invoice. They are separate so one UPI can cover two invoices, or one invoice can be paid in instalments.

      | What happened | Invoice shows |
      | --- | --- |
      | Full amount recorded and applied | Paid |
      | Part recorded and applied | Partially paid |
      | Nothing received | Issued or Overdue |

      Use Record payment. To split a receipt, record it once, then Allocations for each invoice.
- id: guide_follow_ups
  type: markdown
  title: Follow-ups
  options:
    content: |
      **INV-1005 is unpaid on the due date.** It becomes overdue. A follow-up is created. If WhatsApp + Automations are set up, the customer is reminded. You record the payment. The invoice shows paid. Follow-ups stop.

      You can also create a follow-up when the customer says they will pay later (Follow-ups → New).
- id: guide_whatsapp
  type: markdown
  title: WhatsApp reminders
  options:
    content: |
      This app does not send WhatsApp itself.

      1. Connect WhatsApp for the workspace (Channels).
      2. Open **Automations**.
      3. When **Follow-up due**, action **Send WhatsApp**.
      4. Write a message or template (name, invoice, amount due).
      5. Test, then enable.

      After the invoice is paid, pending follow-ups complete so reminders stop.
- id: guide_more
  type: markdown
  title: Import, Command Chat, troubleshooting
  options:
    content: |
      **Import unpaid invoices.** CSV headers: invoice_number, name, phone, due_amount, due_date. Map name/phone to the contact; due_amount to Total. Identity uses name, phone, or email — not a person id.

      **Command Chat** (screens still work): “Raise an invoice for 10000 due next Friday.” “Customer paid 5000 UPI for INV-1005.” “Follow up later — they’ll pay on Friday.”

      **Invoice shows paid too early** — too much was allocated; check Payments / Allocations.
      **Contact not saving** — pick an existing Contacts person, or add them first.
      **Reminder not sending** — WhatsApp connected? Automation enabled? Trigger Follow-up due? Follow-up still pending? Use Test.
      **Import mapping** — due_amount is Total, not Paid.

