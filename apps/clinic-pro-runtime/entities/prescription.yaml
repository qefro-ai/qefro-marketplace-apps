id: prescription
scope: customer
name: Prescription
description: Medication order for a patient
allocate_code:
  prefix: RX-
  start: 1001
fields:
- name: patient_name
  type: string
  required: true
- name: visit_code
  type: string
- name: practitioner_name
  type: string
- name: medication
  type: string
  required: true
- name: dosage
  type: string
- name: frequency
  type: string
- name: duration
  type: string
- name: instructions
  type: string
- name: status
  type: enum
  enum_values:
  - active
  - fulfilled
  - cancelled
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  fulfilled: prescription.created
  cancelled: prescription.created
