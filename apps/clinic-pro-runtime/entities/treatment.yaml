id: treatment
name: Treatment
description: Treatment performed during a visit
allocate_code:
  prefix: TX-
  start: 1001
fields:
- name: visit_code
  type: string
- name: patient_name
  type: string
- name: practitioner_name
  type: string
- name: name
  type: string
  required: true
- name: description
  type: string
- name: status
  type: enum
  enum_values:
  - planned
  - in_progress
  - completed
  - cancelled
- name: started_at
  type: datetime
- name: completed_at
  type: datetime
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  in_progress: treatment.created
  completed: treatment.completed
  cancelled: treatment.created
