id: visit
name: Visit
description: In-clinic encounter linked to an appointment
allocate_code:
  prefix: V-
  start: 1001
fields:
- name: appointment_code
  type: string
- name: patient_name
  type: string
  required: true
- name: practitioner_name
  type: string
- name: visit_at
  type: datetime
- name: date
  type: date
  required: true
- name: status
  type: enum
  enum_values:
  - open
  - in_progress
  - completed
  - cancelled
- name: notes
  type: string
- name: diagnosis
  type: string
  description: Staff clinical note; not used in customer flows
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  in_progress: visit.updated
  completed: visit.updated
  cancelled: visit.updated
