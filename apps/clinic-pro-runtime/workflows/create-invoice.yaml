id: create-invoice
name: Create invoice
description: Create a patient invoice
trigger:
  type: conversation
steps:
- id: ask_patient_name
  type: ask
  field: patient_name
  message: Patient name?
- id: ask_amount
  type: ask
  field: amount
  message: Invoice amount?
- id: run
  type: tool
  tool: entity.invoice.create
  execution: runtime
  input_map:
    patient_name: patient_name
    amount: amount
    currency: currency
    appointment_code: appointment_code
    due_at: due_at
- id: confirm
  type: message
  message: Invoice created for {{patient_name}}.
- id: done
  type: complete
