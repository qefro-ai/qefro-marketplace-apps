id: record-payment
name: Record payment
description: Record a payment against an invoice
trigger:
  type: conversation
steps:
- id: ask_patient_name
  type: ask
  field: patient_name
  message: Patient name?
- id: ask_invoice_code
  type: ask
  field: invoice_code
  message: Invoice code?
- id: ask_amount
  type: ask
  field: amount
  message: Payment amount?
- id: run
  type: tool
  tool: entity.payment.create
  execution: runtime
  input_map:
    patient_name: patient_name
    invoice_code: invoice_code
    amount: amount
    currency: currency
- id: confirm
  type: message
  message: Payment recorded for invoice {{invoice_code}}.
- id: done
  type: complete
