id: reschedule-appointment
name: Reschedule appointment
description: Move an appointment to a new date/time
trigger:
  type: conversation
steps:
- id: ask_id
  type: ask
  field: id
  message: Which appointment id should we move?
- id: ask_date
  type: ask
  field: date
  message: New date?
- id: ask_time
  type: ask
  field: time
  message: New time?
- id: run
  type: tool
  tool: entity.appointment.update
  execution: runtime
  input_map:
    id: id
    date: date
    time: time
    scheduled_at: scheduled_at
- id: confirm
  type: message
  message: Appointment {{id}} rescheduled to {{date}}.
- id: done
  type: complete
