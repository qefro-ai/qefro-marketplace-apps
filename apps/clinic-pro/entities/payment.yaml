id: payment
scope: customer
name: Payment
description: Payment against an invoice
allocate_code:
  prefix: PAY-
  start: 1001
fields:
- name: patient_name
  type: string
  required: true
- name: invoice_id
  type: relation
  ref_entity: invoice
- name: invoice_code
  type: string
  required: true
- name: amount
  type: float
  required: true
- name: currency
  type: string
- name: status
  type: enum
  enum_values:
  - pending
  - completed
  - failed
  - refunded
- name: paid_at
  type: datetime
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
  inherit_from: invoice_id
status_events:
  completed: payment.created
  failed: payment.created
  refunded: payment.created
relation_caps:
- field: amount
  relation: invoice_id
  parent_field: amount
