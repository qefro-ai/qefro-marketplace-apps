id: clinic-pro
name: Clinic Pro
version: 1.3.2
hosting: runtime
description: Metadata-only clinic management Marketplace App executed by Qefro Runtime
  (no SDK, no custom server)
category: healthcare
tags:
- clinic
- healthcare
- runtime
- pro
channels:
- widget
- whatsapp
entities:
- patient
- practitioner
- appointment_slot
- appointment
- visit
- treatment
- prescription
- invoice
- payment
flows:
- book-appointment
- reschedule-appointment
- cancel-appointment
- lookup-appointment
- create-patient
- create-practitioner
- create-slot
- create-visit
- create-prescription
- create-invoice
- record-payment
events:
- patient.created
- patient.updated
- appointment.created
- appointment.updated
- appointment.cancelled
- appointment.completed
- visit.created
- visit.updated
- treatment.created
- treatment.completed
- prescription.created
- invoice.created
- invoice.paid
- invoice.overdue
- payment.created
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
automation_templates:
- id: follow_up_patient_created
  name: Follow-up when a patient is created
  description: Create a Hub CRM follow-up when a new patient is added.
  trigger:
    event: patient.created
  actions:
  - type: create_followup
    due_in_hours: 24
    note: Follow up with the new patient
- id: appointment_booked_whatsapp
  name: WhatsApp when an appointment is booked
  description: Message the workspace Person with the appointment date and time. Requires an approved WhatsApp template named appointment_reminder on this workspace.
  trigger:
    event: appointment.created
  actions:
  - type: send_whatsapp
    template: appointment_reminder
    parameters:
    - "{{person.name}}"
    - "{{entity.date}}"
    - "{{entity.time}}"
    - "{{entity.practitioner_name}}"
    body: |
      Hi {{person.name}},

      Your appointment is scheduled for {{entity.date}} {{entity.time}}.

      Please arrive 10 minutes early.

followup_sequences:
- id: patient_appointment_followup
  name: Patient appointment follow-up
  description: Follow up with patients who missed or haven't confirmed their appointment until they respond.
  channel: whatsapp
  steps:
  - id: step_1
    template: patient_followup_1
    delay:
      unit: hours
      value: 24
  - id: step_2
    template: patient_followup_2
    delay:
      unit: days
      value: 3
  - id: step_3
    template: patient_followup_3
    delay:
      unit: days
      value: 7
settings:
- key: timezone
  type: string
  default: Asia/Kolkata
  description: IANA timezone for clinic appointment slots
- key: duration_minutes
  type: number
  default: 15
  description: Appointment duration in minutes
- key: start_time
  type: string
  default: "09:00"
  description: Opening time (HH:MM, 24-hour)
- key: end_time
  type: string
  default: "18:00"
  description: Closing time (HH:MM, 24-hour)
- key: closed_days
  type: string
  default: sunday
  description: Comma-separated weekdays the clinic is closed
- key: date_window_days
  type: number
  default: 14
  description: How many days ahead to offer appointment slots
- key: blocking_statuses
  type: string
  default: scheduled,confirmed,checked_in
  description: Appointment statuses that occupy a practitioner slot
triggers:
- id: book_appointment
  workflow: book-appointment
  input_variable: appointment_input
  match:
    intents:
    - book an appointment
    - schedule an appointment
    - book a clinic visit
    confirmation:
      reply_signals:
      - appointment
      - booked
      required_slots:
      - patient_name
      - date
  confirmation_message: Appointment booked for {{patient_name}} on {{date}}.
- id: reschedule_appointment
  workflow: reschedule-appointment
  input_variable: appointment_reschedule
  match:
    intents:
    - reschedule my appointment
    - move my clinic appointment
    confirmation:
      reply_signals:
      - rescheduled
      required_slots:
      - id
      - date
  confirmation_message: Appointment for {{patient_name}} rescheduled to {{date}}.
- id: cancel_appointment
  workflow: cancel-appointment
  input_variable: appointment_cancel
  match:
    intents:
    - cancel my appointment
    - cancel clinic appointment
    confirmation:
      reply_signals:
      - cancelled
      required_slots:
      - id
  confirmation_message: Appointment for {{patient_name}} cancelled.
- id: lookup_appointment
  workflow: lookup-appointment
  input_variable: appointment_lookup
  match:
    intents:
    - find my appointment
    - appointment status
    confirmation:
      reply_signals:
      - appointment
      required_slots:
      - id
  confirmation_message: Here is appointment for {{patient_name}}.
conversation_slots:
- id: patient_name
  labels:
  - patient
  - name
  kind: person_name
  identity: person_name
- id: name
  labels:
  - name
  - patient name
  kind: person_name
  identity: person_name
- id: practitioner_name
  labels:
  - doctor
  - practitioner
  - clinician
  kind: string
  chip_prefix: doctor
- id: reason
  labels:
  - reason
  - complaint
  kind: string
- id: date
  labels:
  - date
  - tomorrow
  - today
  kind: date
- id: time
  labels:
  - time
  kind: time
  chip_prefix: time
- id: id
  labels:
  - appointment
  - appointment id
  - booking id
  kind: string
- id: medication
  labels:
  - medication
  - medicine
  - drug
  kind: string
- id: amount
  labels:
  - amount
  - total
  kind: string
- id: invoice_code
  labels:
  - invoice
  - invoice code
  - bill
  kind: string
- id: phone
  labels:
  - phone
  - mobile
  kind: phone
- id: email
  labels:
  - email
  kind: email
- id: status
  labels:
  - status
  - cancelled
  kind: string
ui:
  name: Clinic Pro
  navigation_layout: sidebar
