- id: patient_form
  type: form
  title: Create patient
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: phone
      label: Phone
      type: text
      required: false
    - name: email
      label: Email
      type: text
      required: false
    - name: notes
      label: Notes
      type: text
      required: false
    submit_label: Create
    action:
      trigger: create-patient
- id: appointment_form
  type: form
  title: Book appointment
  options:
    fields:
    - name: patient_name
      label: Patient name
      type: text
      required: true
    - name: practitioner_name
      label: Practitioner
      type: text
      required: false
    - name: date
      label: Date
      type: date
      required: true
    - name: time
      label: Time
      type: time
      required: false
    - name: reason
      label: Reason
      type: text
      required: false
    submit_label: Book
    action:
      trigger: book-appointment
- id: practitioner_form
  type: form
  title: Add practitioner
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: specialty
      label: Specialty
      type: text
      required: false
    - name: phone
      label: Phone
      type: text
      required: false
    - name: email
      label: Email
      type: text
      required: false
    submit_label: Add
    action:
      trigger: create-practitioner
- id: slot_form
  type: form
  title: Open slot
  options:
    fields:
    - name: practitioner_name
      label: Practitioner
      type: text
      required: true
    - name: start_at
      label: Start (ISO datetime)
      type: text
      required: true
    - name: end_at
      label: End (ISO datetime)
      type: text
      required: true
    - name: location
      label: Location
      type: text
      required: false
    submit_label: Open slot
    action:
      trigger: create-slot
- id: visit_form
  type: form
  title: Create visit
  options:
    fields:
    - name: patient_name
      label: Patient name
      type: text
      required: true
    - name: practitioner_name
      label: Practitioner
      type: text
      required: false
    - name: date
      label: Date
      type: date
      required: true
    - name: notes
      label: Notes
      type: text
      required: false
    submit_label: Create
    action:
      trigger: create-visit
- id: prescription_form
  type: form
  title: Create prescription
  options:
    fields:
    - name: patient_name
      label: Patient name
      type: text
      required: true
    - name: medication
      label: Medication
      type: text
      required: true
    - name: dosage
      label: Dosage
      type: text
      required: false
    - name: frequency
      label: Frequency
      type: text
      required: false
    - name: duration
      label: Duration
      type: text
      required: false
    - name: instructions
      label: Instructions
      type: text
      required: false
    submit_label: Create
    action:
      trigger: create-prescription
- id: invoice_form
  type: form
  title: Create invoice
  options:
    fields:
    - name: patient_name
      label: Patient name
      type: text
      required: true
    - name: amount
      label: Amount
      type: text
      required: true
    - name: currency
      label: Currency
      type: text
      required: false
    - name: due_at
      label: Due date
      type: date
      required: false
    submit_label: Create
    action:
      trigger: create-invoice
- id: payment_form
  type: form
  title: Record payment
  options:
    fields:
    - name: patient_name
      label: Patient name
      type: text
      required: true
    - name: invoice_code
      label: Invoice code
      type: text
      required: true
    - name: amount
      label: Amount
      type: text
      required: true
    - name: currency
      label: Currency
      type: text
      required: false
    submit_label: Record
    action:
      trigger: record-payment
- id: appointments_status
  type: status
  title: Appointments
  source: appointments
  options:
    rows_path: items
    status_field: status
    label_field: patient_name
    empty_title: No appointments yet
- id: patients_table
