id: book-appointment
name: Book appointment
description: Customer/staff book an appointment via EntityService
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_patient_name
  type: ask
  field: patient_name
  message: Who is the appointment for? Reply with the patient name.
- id: list_practitioners
  type: tool
  tool: entity.practitioner.list
  execution: runtime
  output: practitioners
  input_map:
    limit: $literal:20
- id: ask_doctor
  type: ask
  field: practitioner_name
  message: Which doctor would you like? Tap a button below. (Configure practitioners in Clinic Pro → Practitioners.)
  choices_from: practitioners
  title_field: name
  value_field: name
  chip_prefix: doctor
- id: list_slots
  type: tool
  tool: entity.appointment_slot.list
  execution: runtime
  output: slots
  input_map:
    filter.status: $literal:open
    filter.practitioner_name: practitioner_name
    limit: $literal:20
- id: ask_slot
  type: ask
  field: time
  message: Pick an open slot for that doctor.
  choices_from: slots
  title_field: start_at
  value_field: start_at
  chip_prefix: time
- id: ask_reason
  type: ask
  field: reason
  message: Reason for the visit?
- id: run
  type: tool
  tool: entity.appointment.create
  execution: runtime
  input_map:
    patient_name: patient_name
    practitioner_name: practitioner_name
    date: date
    time: time
    reason: reason
    notes: notes
- id: confirm
  type: message
  message: Appointment booked for {{patient_name}} with {{practitioner_name}} on {{date}} at {{time}}.
- id: done
  type: complete
