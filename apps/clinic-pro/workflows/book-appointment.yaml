id: book-appointment
name: Book appointment
description: Customer/staff book an appointment via EntityService
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_patient_name
  type: ask
  field: patient_name
  message: "👤 Who is the appointment for? Reply with the patient name."
- id: list_practitioners
  type: tool
  tool: entity.practitioner.list
  execution: runtime
  output: practitioners
  input_map:
    filter.status: $literal:active
    limit: $literal:20
- id: ask_doctor
  type: ask
  field: practitioner_id
  message: "👨‍⚕️ Which doctor would you like? Tap a button below. (Configure practitioners in Clinic Pro → Practitioners.)"
  choices_from: practitioners
  title_field: name
  value_field: id
  chip_prefix: doctor
- id: get_practitioner
  type: tool
  tool: entity.practitioner.get
  execution: runtime
  output: practitioner
  input_map:
    id: practitioner_id
- id: list_dates
  type: tool
  tool: entity.appointment.availability
  execution: runtime
  output: available_dates
  input_map:
    kind: $literal:dates
    practitioner_id: practitioner_id
- id: ask_date
  type: ask
  field: date
  message: "📅 Choose a date"
  choices_from: available_dates
  title_field: label
  value_field: value
  chip_prefix: date
- id: list_slots
  type: tool
  tool: entity.appointment.availability
  execution: runtime
  output: available_slots
  input_map:
    kind: $literal:slots
    date: date
    practitioner_id: practitioner_id
- id: ask_time
  type: ask
  field: time
  message: "⏰ Choose a time"
  choices_from: available_slots
  title_field: label
  value_field: time
  chip_prefix: time
- id: validate_slot
  type: tool
  tool: entity.appointment.availability
  execution: runtime
  output: slot_check
  input_map:
    kind: $literal:validate
    date: date
    time: time
    practitioner_id: practitioner_id
- id: ask_reason
  type: ask
  field: reason
  message: "📋 Reason for the visit?"
- id: run
  type: tool
  tool: entity.appointment.create
  execution: runtime
  input_map:
    patient_name: patient_name
    practitioner_id: practitioner_id
    practitioner_name: practitioner.name
    date: date
    time: time
    scheduled_at: scheduled_at
    reason: reason
    notes: notes
    status: $literal:scheduled
- id: confirm
  type: message
  message: "✅ Appointment booked for {{patient_name}} with {{practitioner_name}} on {{date}} at {{time}}."
- id: done
  type: complete
