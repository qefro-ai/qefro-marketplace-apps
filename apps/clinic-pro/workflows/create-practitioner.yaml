id: create-practitioner
name: Create practitioner
description: Staff adds a clinician to the roster
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: ask_name
  type: ask
  field: name
  message: "👨‍⚕️ Practitioner name?"
- id: ask_specialty
  type: ask
  field: specialty
  message: "📋 Specialty?"
- id: run
  type: tool
  tool: entity.practitioner.create
  execution: runtime
  input_map:
    name: name
    specialty: specialty
    email: email
    phone: phone
    status: $literal:active
- id: confirm
  type: message
  message: "👨‍⚕️ Practitioner {{name}} added."
- id: done
  type: complete
