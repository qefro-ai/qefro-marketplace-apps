id: create-visit
name: Create visit
description: Open a clinic visit for a patient
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: list_patients
  type: tool
  tool: entity.patient.list
  execution: runtime
  output: patients
  input_map:
    filter.status: $literal:active
    limit: $literal:20
- id: ask_patient
  type: ask
  field: patient_name
  message: "👤 Which patient?"
  empty_message: "There are no patients on file yet."
  choices_from: patients
  title_field: code
  value_field: code
  chip_prefix: patient
- id: ask_date
  type: ask
  field: date
  message: "📅 Visit date?"
- id: run
  type: tool
  tool: entity.visit.create
  execution: runtime
  input_map:
    patient_name: patient_name
    practitioner_name: practitioner_name
    appointment_code: appointment_code
    date: date
    notes: notes
- id: confirm
  type: message
  message: "✅ Visit created for {{patient_name}} on {{date}}."
- id: done
  type: complete
