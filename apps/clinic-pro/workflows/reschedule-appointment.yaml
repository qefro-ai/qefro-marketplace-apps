id: reschedule-appointment
name: Reschedule appointment
description: Move an appointment to a new date/time
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: list_appointments
  type: tool
  tool: entity.appointment.list
  execution: runtime
  output: appointments
  input_map:
    filter.status: $literal:scheduled
    limit: $literal:20
- id: ask_id
  type: ask
  field: id
  message: "📅 Which appointment would you like to reschedule?"
  choices_from: appointments
  title_field: patient_name
  value_field: id
  chip_prefix: appointment
- id: ask_date
  type: ask
  field: date
  message: "📅 New date?"
- id: ask_time
  type: ask
  field: time
  message: "⏰ New time?"
- id: run
  type: tool
  tool: entity.appointment.update
  execution: runtime
  input_map:
    id: id
    date: date
    time: time
    scheduled_at: scheduled_at
- id: confirm
  type: message
  message: "🔄 Appointment for {{patient_name}} rescheduled to {{date}}."
- id: done
  type: complete
