- id: intro
  type: markdown
  title: Clinic
  options:
    content: "Native clinic operations app — visits and slots, not an EHR. Chat “book a visit tomorrow” uses EntityService. Automations: visit.created → send confirmation."
- id: visit_form
  type: form
  title: "Book visit"
  options:
    fields:
      - name: patient_name
        label: "Patient name"
        type: text
        required: true
      - name: reason
        label: Reason
        type: text
        required: false
      - name: date
        label: Date
        type: date
        required: true
      - name: time
        label: Time
        type: time
        required: false
    submit_label: Book
    action:
      trigger: book-visit
- id: visits_status
  type: status
  title: Visits
  source: visits
  options:
    rows_path: items
    status_field: status
    label_field: patient_name
    empty_title: "Nothing yet"
- id: visits_table
  type: table
  title: Visits
  source: visits
  options:
    rows_path: items
    empty_title: "No visits yet"
    columns:
      - key: patient_name
        header: Patient
      - key: date
        header: Date
      - key: status
        header: Status
- id: practitioners_table
  type: table
  title: Practitioners
  source: practitioners
  options:
    rows_path: items
    empty_title: "No practitioners yet"
    columns:
      - key: name
        header: Name
      - key: specialty
        header: Specialty
- id: slots_table
  type: table
  title: Slots
  source: slots
  options:
    rows_path: items
    empty_title: "No slots yet"
    columns:
      - key: practitioner_name
        header: Practitioner
      - key: date
        header: Date
      - key: status
        header: Status
- id: treatments_table
  type: table
  title: Treatments
  source: treatments
  options:
    rows_path: items
    empty_title: "No treatments yet"
    columns:
      - key: name
        header: Name
      - key: status
        header: Status
