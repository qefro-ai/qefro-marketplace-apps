id: book-visit
name: "Book visit"
description: "Schedule a clinic visit through Qefro Runtime"
trigger:
  type: conversation
steps:
  - id: ask_patient_name
    type: ask
    field: patient_name
    message: "Patient name?"
  - id: ask_date
    type: ask
    field: date
    message: "Which date?"
  - id: ask_reason
    type: ask
    field: reason
    message: "Reason for visit?"
  - id: run
    type: tool
    tool: entity.visit.create
    execution: runtime
    input_map:
      patient_name: patient_name
      date: date
      time: time
      reason: reason
      practitioner_name: practitioner_name
  - id: confirm
    type: message
    message: "Visit booked for {{patient_name}} on {{date}}."
  - id: done
    type: complete
