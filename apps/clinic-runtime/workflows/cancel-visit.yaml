id: cancel-visit
name: "Cancel visit"
description: "Cancel a clinic visit"
trigger:
  type: conversation
steps:
  - id: ask_id
    type: ask
    field: id
    message: "Which visit id should we cancel?"
  - id: ask_status
    type: ask
    field: status
    message: "Type cancelled to confirm."
  - id: run
    type: tool
    tool: entity.visit.update
    execution: runtime
    input_map:
      id: id
      status: status
  - id: confirm
    type: message
    message: "Visit {{id}} cancelled."
  - id: done
    type: complete
