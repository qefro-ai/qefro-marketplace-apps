id: assignment
name: Assignment
description: "Learner assignment"
fields:
  - name: title
    type: string
    required: true
  - name: course_id
    type: relation
    ref_entity: course
  - name: course_title
    type: string
  - name: status
    type: enum
    enum_values:
      - assigned
      - submitted
      - reviewed
status_events:
  submitted: assignment.submitted
  reviewed: assignment.reviewed
