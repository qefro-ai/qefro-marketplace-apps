id: education
name: Education
version: 1.1.0
hosting: runtime
description: Courses, enrollments, sessions, and assignments as a native Qefro coaching
  application
category: education
tags:
- education
- coaching
- runtime
channels:
- widget
- whatsapp
entities:
- course
- enrollment
- session
- assignment
- instructor
flows:
- enroll-student
- schedule-session
- complete-session
- lookup-enrollment
- create-course
- create-instructor
- create-assignment
events:
- enrollment.created
- session.created
- session.completed
- session.cancelled
- session.due
- assignment.created
- assignment.submitted
- assignment.reviewed
- course.created
- course.updated
- instructor.created
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: enroll_student
  workflow: enroll-student
  input_variable: enroll_input
  match:
    intents:
    - enroll a student
    - sign up for the course
    - register a learner
    - add enrollment
    confirmation:
      reply_signals:
      - enrolled
      - enrollment
      required_slots:
      - learner_name
      - course_title
  confirmation_message: '{{learner_name}} enrolled in {{course_title}}.'
- id: schedule_session
  workflow: schedule-session
  input_variable: session_input
  match:
    intents:
    - schedule a class
    - book a coaching session
    - schedule session
    - book a session
    confirmation:
      reply_signals:
      - scheduled
      - session
      required_slots:
      - course_title
      - date
  confirmation_message: Session scheduled for {{course_title}} on {{date}}.
- id: complete_session
  workflow: complete-session
  input_variable: session_complete
  match:
    intents:
    - complete the session
    - mark class done
    - finish session
    confirmation:
      reply_signals:
      - completed
      required_slots:
      - id
  confirmation_message: Session {{title}} completed.
- id: lookup_enrollment
  workflow: lookup-enrollment
  input_variable: enroll_lookup
  match:
    intents:
    - find the enrollment
    - enrollment status
    - check enrollment
    - view enrollment
    confirmation:
      reply_signals:
      - enrollment
      required_slots:
      - id
  confirmation_message: Here is enrollment for {{student_name}}.
- id: create_course
  workflow: create-course
  input_variable: course_input
  match:
    intents:
    - create a course
    - add a new course
    - new course
    confirmation:
      reply_signals:
      - course
      - created
      required_slots:
      - title
  confirmation_message: Course {{title}} created.
conversation_slots:
- id: learner_name
  labels:
  - learner
  - student
  - name
  kind: person_name
  identity: person_name
- id: name
  labels:
  - name
  kind: person_name
  identity: person_name
- id: course_title
  labels:
  - course
  - program
  - class
  kind: string
- id: title
  labels:
  - title
  kind: string
- id: level
  labels:
  - level
  - beginner
  - advanced
  kind: string
- id: date
  labels:
  - date
  - tomorrow
  kind: date
- id: time
  labels:
  - time
  kind: time
  chip_prefix: time
- id: id
  labels:
  - enrollment
  - session id
  kind: string
- id: specialty
  labels:
  - specialty
  - subject
  kind: string
- id: email
  labels:
  - email
  kind: email
- id: phone
  labels:
  - phone
  - mobile
  kind: phone
- id: status
  labels:
  - status
  - completed
  kind: string
ui:
  name: Education
