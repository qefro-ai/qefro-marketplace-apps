- id: enroll_form
  type: form
  title: Enroll learner
  options:
    fields:
    - name: learner_name
      label: Learner
      type: text
      required: true
    - name: course_title
      label: Course
      type: text
      required: true
    - name: date
      label: Date
      type: date
      required: false
    submit_label: Enroll
    action:
      trigger: enroll-student
- id: course_form
  type: form
  title: Create course
  options:
    fields:
    - name: title
      label: Title
      type: text
      required: true
    - name: level
      label: Level
      type: text
      required: false
    submit_label: Create
    action:
      trigger: create-course
- id: instructor_form
  type: form
  title: Add instructor
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: email
      label: Email
      type: text
      required: false
    - name: phone
      label: Phone
      type: text
      required: false
    - name: specialty
      label: Specialty
      type: text
      required: false
    submit_label: Add
    action:
      trigger: create-instructor
- id: assignment_form
  type: form
  title: Create assignment
  options:
    fields:
    - name: title
      label: Title
      type: text
      required: true
    - name: course_title
      label: Course
      type: text
      required: true
    submit_label: Create
    action:
      trigger: create-assignment
- id: enroll_status
  type: status
  title: Enrollments
  source: enrollments
  options:
    rows_path: items
    status_field: status
    label_field: learner_name
    empty_title: Nothing yet
- id: enroll_table
  type: table
  title: Enrollments
  source: enrollments
  options:
    rows_path: items
    empty_title: No enrollments yet
    columns:
    - key: learner_name
      header: Learner
    - key: course_title
      header: Course
    - key: status
      header: Status
- id: courses_table
  type: table
  title: Courses
  source: courses
  options:
    rows_path: items
    empty_title: No courses yet
    columns:
    - key: title
      header: Title
    - key: status
      header: Status
- id: sessions_table
  type: table
  title: Sessions
  source: sessions
  options:
    rows_path: items
    empty_title: No sessions yet
    columns:
    - key: course_title
      header: Course
    - key: date
      header: Date
    - key: status
      header: Status
- id: assignments_table
  type: table
  title: Assignments
  source: assignments
  options:
    rows_path: items
    empty_title: No assignments yet
    columns:
    - key: title
      header: Title
    - key: course_title
      header: Course
    - key: status
      header: Status
- id: instructors_table
  type: table
  title: Instructors
  source: instructors
  options:
    rows_path: items
    empty_title: No instructors yet
    columns:
    - key: name
      header: Name
    - key: specialty
      header: Specialty
    - key: email
      header: Email
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Education
  options:
    content: Courses, enrollments, and sessions — open a list and tap New to add records.
- id: metric_enrollment
  type: metric
  title: Enrollments
  source: enrollments
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: enrollments
- id: metric_course
  type: metric
  title: Courses
  source: courses
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: courses
- id: metric_session
  type: metric
  title: Sessions
  source: sessions
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: sessions
- id: metric_assignment
  type: metric
  title: Assignments
  source: assignments
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: assignments
- id: enrollment_dash_status
  type: status
  title: Enrollments status
  source: enrollments
  options:
    rows_path: items
    status_field: status
    label_field: student_name
    empty_title: No enrollments yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: enrollments
    action_label: View all
- id: enrollment_dash_table
  type: table
  title: Recent Enrollments
  source: enrollments
  options:
    rows_path: items
    limit: 8
    empty_title: No enrollments yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: enrollments
    action_label: View all
    columns:
    - key: learner_name
      header: Learner Name
    - key: course_title
      header: Course Title
    - key: date
      header: Date
    - key: status
      header: Status
