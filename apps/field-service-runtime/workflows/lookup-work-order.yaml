id: lookup-work-order
name: "Lookup work order"
description: "Fetch one work order"
trigger:
  type: conversation
steps:
  - id: ask_id
    type: ask
    field: id
    message: "Which work order id?"
  - id: run
    type: tool
    tool: entity.work_order.get
    execution: runtime
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      Here is work order {{id}}.
      {{items_text}}

  - id: done
    type: complete
    message: ""
