id: customer
scope: customer
name: Customer
description: "Customer bound to Person"
allocate_code:
  prefix: CUS-
  start: 1001
fields:
  - name: name
    type: string
    required: true
  - name: email
    type: email
  - name: phone
    type: phone
  - name: status
    type: enum
    enum_values:
      - active
      - inactive
  - name: person_id
    type: person
    ref_entity: person
    description: "Existing Qefro Person identity"
