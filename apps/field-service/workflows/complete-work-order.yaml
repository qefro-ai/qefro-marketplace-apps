id: complete-work-order
name: "Complete work order"
description: "Mark a job completed"
trigger:
  type: conversation
constants:
  completed: completed
steps:
  - id: list_work_orders
    type: tool
    tool: entity.work_order.list
    execution: runtime
    output: work_orders
    input_map:
      filter.status: $literal:in_progress
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "Which work order is done?"
    choices_from: work_orders
    title_field: title
    value_field: id
    chip_prefix: work order
  - id: run
    type: tool
    tool: entity.work_order.update
    execution: runtime
    input_map:
      id: id
      status: $constants.completed
  - id: confirm
    type: message
    message: "Work order {{id}} completed."
  - id: done
    type: complete
