id: create-site
name: "Add site"
description: "Register a customer site"
surfaces:
- staff
trigger:
  type: conversation
steps:
  - id: ask_name
    type: ask
    field: name
    message: "🔧 Site name?"
  - id: ask_address
    type: ask
    field: address
    message: "📍 Address?"
  - id: ask_contact
    type: ask
    field: contact_name
    message: "👤 Contact person?"
  - id: run
    type: tool
    tool: entity.site.create
    execution: runtime
    input_map:
      name: name
      address: address
      contact_name: contact_name
  - id: confirm
    type: message
    message: "🔧 Site {{name}} registered at {{address}}."
  - id: done
    type: complete
