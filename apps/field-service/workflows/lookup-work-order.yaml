id: lookup-work-order
name: "Lookup work order"
description: "Fetch one work order"
trigger:
  type: conversation
steps:
  - id: list_work_orders
    type: tool
    tool: entity.work_order.list
    execution: runtime
    output: work_orders
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "📋 Which work order would you like to view?"
    choices_from: work_orders
    title_field: title
    value_field: id
    chip_prefix: work order
  - id: run
    type: tool
    tool: entity.work_order.get
    execution: runtime
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      🔧 **Work Order {{id}}**
      {{items_text}}

  - id: done
    type: complete
    message: ""
