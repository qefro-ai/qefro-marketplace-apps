id: add-ticket-comment
name: "Add ticket comment"
description: "Add a comment through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: list_tickets
    type: tool
    tool: entity.ticket.list
    execution: runtime
    output: tickets
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "Which ticket would you like to comment on?"
    choices_from: tickets
    title_field: subject
    value_field: id
    chip_prefix: ticket
  - id: ask_body
    type: ask
    field: body
    message: "Comment text?"
  - id: run
    type: tool
    tool: create_ticket_comment
    execution: http
    input_map:
      id: id
      body: body
  - id: confirm
    type: message
    message: "Comment added to ticket {{id}}."
  - id: done
    type: complete
    message: ""
