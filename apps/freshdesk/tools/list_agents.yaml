id: list_agents
description: "Staff-only agent list on the workspace HTTP connection"
connection: freshdesk
method: GET
path: "/api/v2/agents"
timeout_seconds: 15
pagination:
  style: query
  limit_param: limit
  default_limit: 20
  max_limit: 50
response:
  items: agents
access:
  surfaces:
    - staff
