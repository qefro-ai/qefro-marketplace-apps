- id: ticket_form
  type: form
  title: New ticket
  options:
    fields:
    - name: subject
      label: Subject
      type: text
      required: true
    - name: description
      label: Description
      type: text
      required: true
    - name: requester_email
      label: Requester email
      type: text
      required: true
    submit_label: Create ticket
    action:
      trigger: create-support-ticket
- id: tickets_status
  type: status
  title: Tickets
  source: tickets
  options:
    rows_path: items
    status_field: status
    label_field: subject
    empty_title: Nothing yet
- id: tickets_table
  type: table
  title: Tickets
  source: tickets
  options:
    rows_path: items
    empty_title: No tickets yet
    columns:
    - key: subject
      header: Subject
    - key: status
      header: Status
- id: contacts_table
  type: table
  title: Freshdesk contacts
  source: contacts
  options:
    rows_path: items
    empty_title: No freshdesk contacts yet
    columns:
    - key: name
      header: Name
    - key: email
      header: Email
- id: agents_table
  type: table
  title: Agents
  source: agents
  options:
    rows_path: items
    empty_title: No agents yet
    columns:
    - key: name
      header: Name
    - key: email
      header: Email
- id: intro
  type: markdown
  title: Freshdesk
  options:
    content: Freshdesk — open a list and tap New to add records.
- id: metric_ticket
  type: metric
  title: Tickets
  source: tickets
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: tickets
- id: ticket_dash_status
  type: status
  title: Tickets status
  source: tickets
  options:
    rows_path: items
    status_field: status
    label_field: subject
    empty_title: No tickets yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: tickets
    action_label: View all
- id: ticket_dash_table
  type: table
  title: Recent Tickets
  source: tickets
  options:
    rows_path: items
    limit: 8
    empty_title: No tickets yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: tickets
    action_label: View all
    columns:
    - key: subject
      header: Subject
    - key: status
      header: Status
