id: list-my-tickets
name: "List my tickets"
description: "Show the authenticated customer's tickets"
surfaces:
- customer
trigger:
  type: conversation
steps:
  - id: run
    type: tool
    tool: list_my_tickets
    execution: http
  - id: confirm
    type: message
    message: |
      📋 **Your Tickets**
      {{items_text}}
  - id: done
    type: complete
    message: ""
