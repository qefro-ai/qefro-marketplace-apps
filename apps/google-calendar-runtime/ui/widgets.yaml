- id: intro
  type: markdown
  title: "Google Calendar"
  options:
    content: "Metadata Marketplace App. Staff chat “schedule an appointment” runs generic Runtime HTTP against the workspace Google Calendar connection. Customer Hub identity is not the Google account — these tools are staff-only."
- id: event_form
  type: form
  title: "Schedule event"
  options:
    fields:
      - name: calendar_id
        label: "Calendar id"
        type: text
        required: true
      - name: summary
        label: Title
        type: text
        required: true
      - name: start
        label: Start
        type: text
        required: true
      - name: end
        label: End
        type: text
        required: true
    submit_label: "Create event"
    action:
      trigger: schedule-appointment
- id: events_status
  type: status
  title: Events
  source: events
  options:
    rows_path: items
    status_field: status
    label_field: summary
    empty_title: "Nothing yet"
- id: calendars_table
  type: table
  title: Calendars
  source: calendars
  options:
    rows_path: items
    empty_title: "No calendars yet"
    columns:
      - key: summary
        header: Name
      - key: time_zone
        header: Timezone
- id: events_table
  type: table
  title: Events
  source: events
  options:
    rows_path: items
    empty_title: "No events yet"
    columns:
      - key: summary
        header: Title
      - key: start
        header: Start
      - key: status
        header: Status
