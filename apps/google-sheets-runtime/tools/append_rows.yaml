id: append_rows
description: "Staff-only append rows to a range"
connection: google-sheets
method: POST
path: "/v4/spreadsheets/{spreadsheet_id}/values/{range}:append"
timeout_seconds: 15
query:
  valueInputOption: USER_ENTERED
body:
  values:
    - "['{col1}', '{col2}', '{col3}']"
required_scopes:
  - "https://www.googleapis.com/auth/spreadsheets"
access:
  surfaces:
    - staff
