id: lookup-shipment
name: "Lookup shipment"
description: "Fetch one shipment"
trigger:
  type: conversation
steps:
  - id: ask_id
    type: ask
    field: id
    message: "Which shipment id?"
  - id: run
    type: tool
    tool: entity.shipment.get
    execution: runtime
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      Here is shipment {{id}}.
      {{items_text}}

  - id: done
    type: complete
    message: ""
