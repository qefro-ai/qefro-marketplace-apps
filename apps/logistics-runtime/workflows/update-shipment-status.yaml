id: update-shipment-status
name: "Update shipment status"
description: "Advance shipment state"
trigger:
  type: conversation
steps:
  - id: ask_id
    type: ask
    field: id
    message: "Which shipment id?"
  - id: ask_status
    type: ask
    field: status
    message: "New status (in_transit, delivered, exception)?"
  - id: run
    type: tool
    tool: entity.shipment.update
    execution: runtime
    input_map:
      id: id
      status: status
  - id: confirm
    type: message
    message: "Shipment {{id}} is now {{status}}."
  - id: done
    type: complete
