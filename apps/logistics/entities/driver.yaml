id: driver
name: Driver
description: "Fleet driver"
fields:
  - name: name
    type: string
    required: true
  - name: license_number
    type: string
  - name: phone
    type: phone
  - name: status
    type: enum
    enum_values:
      - available
      - on_route
      - off_duty
  - name: user_id
    type: uuid
    description: "Reference to the authenticated tenant member (Qefro user)"
