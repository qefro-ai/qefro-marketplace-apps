id: logistics
name: Logistics
version: 1.0.1
hosting: runtime
description: Vehicles, consignments, shipments, and stops as a native Qefro logistics
  application
category: logistics
tags:
- logistics
- shipping
- runtime
channels:
- widget
- whatsapp
entities:
- vehicle
- consignment
- shipment
- stop
- driver
- warehouse
flows:
- create-shipment
- update-shipment-status
- cancel-shipment
- lookup-shipment
- create-vehicle
- create-consignment
- create-driver
events:
- shipment.created
- shipment.updated
- shipment.completed
- shipment.cancelled
- consignment.created
- vehicle.created
- driver.created
- warehouse.created
- stop.completed
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: create_shipment
  workflow: create-shipment
  input_variable: shipment_input
  match:
    intents:
    - create a shipment
    - book a delivery
    confirmation:
      reply_signals:
      - shipment
      required_slots:
      - origin
      - destination
  confirmation_message: Shipment created from {{origin}} to {{destination}}.
- id: update_shipment_status
  workflow: update-shipment-status
  input_variable: shipment_status
  match:
    intents:
    - update shipment status
    - mark delivered
    confirmation:
      reply_signals:
      - updated
      required_slots:
      - id
      - status
  confirmation_message: Shipment {{tracking_number}} is now {{status}}.
- id: cancel_shipment
  workflow: cancel-shipment
  input_variable: shipment_cancel
  match:
    intents:
    - cancel the shipment
    - stop the delivery
    confirmation:
      reply_signals:
      - cancelled
      required_slots:
      - id
  confirmation_message: Shipment {{tracking_number}} cancelled.
- id: lookup_shipment
  workflow: lookup-shipment
  input_variable: shipment_lookup
  match:
    intents:
    - track shipment
    - where is my shipment
    confirmation:
      reply_signals:
      - shipment
      required_slots:
      - id
  confirmation_message: Here is shipment {{tracking_number}}.
conversation_slots:
- id: origin
  labels:
  - origin
  - from
  - pickup
  kind: string
- id: destination
  labels:
  - destination
  - to
  - drop
  kind: string
- id: reference
  labels:
  - reference
  - ref
  - consignment ref
  kind: string
- id: customer_name
  labels:
  - customer
  - customer name
  - client
  kind: person_name
  identity: person_name
- id: vehicle_label
  labels:
  - vehicle
  - truck
  kind: string
- id: label
  labels:
  - label
  - plate
  kind: string
- id: capacity
  labels:
  - capacity
  - load
  kind: integer
- id: weight
  labels:
  - weight
  - kg
  kind: float
- id: license_number
  labels:
  - license
  - license number
  - DL
  kind: string
- id: name
  labels:
  - name
  - driver name
  kind: person_name
  identity: person_name
- id: phone
  labels:
  - phone
  - mobile
  - contact
  kind: phone
- id: scheduled_date
  labels:
  - date
  - tomorrow
  kind: date
- id: status
  labels:
  - status
  - delivered
  - in transit
  kind: string
- id: id
  labels:
  - shipment
  - tracking
  - id
  kind: string
ui:
  name: Logistics
