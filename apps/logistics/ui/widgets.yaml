- id: shipment_form
  type: form
  title: New shipment
  options:
    fields:
    - name: origin
      label: Origin
      type: text
      required: true
    - name: destination
      label: Destination
      type: text
      required: true
    - name: scheduled_date
      label: Date
      type: date
      required: false
    submit_label: Create
    action:
      trigger: create-shipment
- id: shipments_status
  type: status
  title: Shipments
  source: shipments
  options:
    rows_path: items
    status_field: status
    label_field: destination
    empty_title: Nothing yet
- id: shipments_table
  type: table
  title: Shipments
  source: shipments
  options:
    rows_path: items
    empty_title: No shipments yet
    columns:
    - key: origin
      header: Origin
    - key: destination
      header: Destination
    - key: status
      header: Status
- id: consignments_table
  type: table
  title: Consignments
  source: consignments
  options:
    rows_path: items
    empty_title: No consignments yet
    columns:
    - key: reference
      header: Ref
    - key: customer_name
      header: Customer
- id: vehicles_table
  type: table
  title: Vehicles
  source: vehicles
  options:
    rows_path: items
    empty_title: No vehicles yet
    columns:
    - key: label
      header: Label
    - key: status
      header: Status
- id: stops_table
  type: table
  title: Stops
  source: stops
  options:
    rows_path: items
    empty_title: No stops yet
    columns:
    - key: address
      header: Address
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Logistics
  options:
    content: Shipments, vehicles, and stops — open a list and tap New to add records.
- id: metric_shipment
  type: metric
  title: Shipments
  source: shipments
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: shipments
- id: shipment_dash_status
  type: status
  title: Shipments status
  source: shipments
  options:
    rows_path: items
    status_field: status
    label_field: tracking_number
    empty_title: No shipments yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: shipments
    action_label: View all
- id: shipment_dash_table
  type: table
  title: Recent Shipments
  source: shipments
  options:
    rows_path: items
    limit: 8
    empty_title: No shipments yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: shipments
    action_label: View all
    columns:
    - key: origin
      header: Origin
    - key: destination
      header: Destination
    - key: vehicle_label
      header: Vehicle Label
    - key: scheduled_date
      header: Scheduled Date
    - key: status
      header: Status
