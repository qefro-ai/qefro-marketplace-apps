- id: shipment_form
  type: form
  title: New shipment
  options:
    fields:
    - name: origin
      label: Origin
      type: text
      required: true
    - name: destination
      label: Destination
      type: text
      required: true
    - name: scheduled_date
      label: Date
      type: date
      required: false
    submit_label: Create
    action:
      trigger: create-shipment
- id: vehicle_form
  type: form
  title: Add vehicle
  options:
    fields:
    - name: label
      label: Label
      type: text
      required: true
    - name: capacity
      label: Capacity (kg)
      type: number
      required: false
    submit_label: Add
    action:
      trigger: create-vehicle
- id: consignment_form
  type: form
  title: Create consignment
  options:
    fields:
    - name: reference
      label: Reference
      type: text
      required: true
    - name: customer_name
      label: Customer name
      type: text
      required: true
    - name: weight
      label: Weight (kg)
      type: number
      required: false
    submit_label: Create
    action:
      trigger: create-consignment
- id: driver_form
  type: form
  title: Add driver
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: license_number
      label: License number
      type: text
      required: false
    - name: phone
      label: Phone
      type: text
      required: false
    submit_label: Add
    action:
      trigger: create-driver
- id: shipments_status
  type: status
  title: Shipments
  source: shipments
  options:
    rows_path: items
    status_field: status
    label_field: destination
    empty_title: Nothing yet
- id: shipments_table
  type: table
  title: Shipments
  source: shipments
  options:
    rows_path: items
    empty_title: No shipments yet
    columns:
    - key: origin
      header: Origin
    - key: destination
      header: Destination
    - key: status
      header: Status
- id: consignments_table
  type: table
  title: Consignments
  source: consignments
  options:
    rows_path: items
    empty_title: No consignments yet
    columns:
    - key: reference
      header: Ref
    - key: customer_name
      header: Customer
- id: vehicles_table
  type: table
  title: Vehicles
  source: vehicles
  options:
    rows_path: items
    empty_title: No vehicles yet
    columns:
    - key: label
      header: Label
    - key: status
      header: Status
- id: drivers_table
  type: table
  title: Drivers
  source: drivers
  options:
    rows_path: items
    empty_title: No drivers yet
    columns:
    - key: name
      header: Name
    - key: license_number
      header: License
    - key: phone
      header: Phone
    - key: status
      header: Status
- id: warehouses_table
  type: table
  title: Warehouses
  source: warehouses
  options:
    rows_path: items
    empty_title: No warehouses yet
    columns:
    - key: name
      header: Name
    - key: address
      header: Address
    - key: capacity
      header: Capacity
    - key: status
      header: Status
- id: stops_table
  type: table
  title: Stops
  source: stops
  options:
    rows_path: items
    empty_title: No stops yet
    columns:
    - key: shipment_id
      header: Shipment
    - key: address
      header: Address
    - key: sequence
      header: Sequence
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Logistics
  options:
    content: Shipments, vehicles, and stops — open a list and tap New to add records.
- id: metric_shipment
  type: metric
  title: Shipments
  source: shipments
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: shipments
- id: metric_vehicle
  type: metric
  title: Vehicles
  source: vehicles
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: vehicles
- id: metric_consignment
  type: metric
  title: Consignments
  source: consignments
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: consignments
- id: metric_stop
  type: metric
  title: Stops
  source: stops
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: stops
- id: shipment_dash_status
  type: status
  title: Shipments status
  source: shipments
  options:
    rows_path: items
    status_field: status
    label_field: tracking_number
    empty_title: No shipments yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: shipments
    action_label: View all
- id: shipment_dash_table
  type: table
  title: Recent Shipments
  source: shipments
  options:
    rows_path: items
    limit: 8
    empty_title: No shipments yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: shipments
    action_label: View all
    columns:
    - key: origin
      header: Origin
    - key: destination
      header: Destination
    - key: vehicle_label
      header: Vehicle Label
    - key: scheduled_date
      header: Scheduled Date
    - key: status
      header: Status
