id: cancel-shipment
name: "Cancel shipment"
description: "Cancel a shipment"
trigger:
  type: conversation
constants:
  cancelled: cancelled
steps:
  - id: list_shipments
    type: tool
    tool: entity.shipment.list
    execution: runtime
    output: shipments
    input_map:
      filter.status: $literal:pending
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "❌ Which shipment would you like to cancel?"
    choices_from: shipments
    title_field: tracking_number
    value_field: id
    chip_prefix: shipment
  - id: run
    type: tool
    tool: entity.shipment.update
    execution: runtime
    input_map:
      id: id
      status: $constants.cancelled
  - id: confirm
    type: message
    message: "❌ Shipment {{id}} cancelled."
  - id: done
    type: complete
