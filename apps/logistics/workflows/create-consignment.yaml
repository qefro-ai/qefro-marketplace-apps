id: create-consignment
name: "Create consignment"
description: "Register a goods consignment"
trigger:
  type: conversation
steps:
  - id: ask_reference
    type: ask
    field: reference
    message: "📦 Consignment reference?"
  - id: ask_customer_name
    type: ask
    field: customer_name
    message: "👤 Customer name?"
  - id: ask_weight
    type: ask
    field: weight
    message: "⚖️ Weight (kg)?"
  - id: run
    type: tool
    tool: entity.consignment.create
    execution: runtime
    input_map:
      reference: reference
      customer_name: customer_name
      weight: weight
  - id: confirm
    type: message
    message: "📦 Consignment {{reference}} created for {{customer_name}}."
  - id: done
    type: complete
