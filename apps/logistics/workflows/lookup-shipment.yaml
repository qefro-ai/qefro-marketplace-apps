id: lookup-shipment
name: "Lookup shipment"
description: "Fetch one shipment"
trigger:
  type: conversation
steps:
  - id: list_shipments
    type: tool
    tool: entity.shipment.list
    execution: runtime
    output: shipments
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "📦 Which shipment would you like to view?"
    choices_from: shipments
    title_field: tracking_number
    value_field: id
    chip_prefix: shipment
  - id: run
    type: tool
    tool: entity.shipment.get
    execution: runtime
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      📦 **Shipment {{tracking_number}}**
      {{items_text}}

  - id: done
    type: complete
    message: ""
