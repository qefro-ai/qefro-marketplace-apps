id: collection_case
scope: customer
name: Collection case
description: Collection work against an outstanding invoice bound to Customer Hub Person
allocate_code:
  prefix: CC-
  start: 1001
fields:
- name: case_number
  type: string
- name: invoice_id
  type: relation
  ref_entity: invoice
  required: true
- name: customer_name
  type: string
  description: Display label only; identity is person_id
- name: outstanding_amount
  type: float
- name: priority
  type: enum
  enum_values:
  - low
  - normal
  - high
  - critical
- name: status
  type: enum
  enum_values:
  - open
  - in_progress
  - promise_to_pay
  - partially_recovered
  - recovered
  - escalated
  - closed
- name: assigned_to
  type: string
- name: opened_at
  type: datetime
- name: next_follow_up_at
  type: datetime
- name: notes
  type: string
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  open: collection_case.created
  in_progress: collection_case.updated
  promise_to_pay: promise_to_pay.created
  partially_recovered: collection_case.updated
  recovered: collection_case.recovered
  escalated: collection_case.escalated
  closed: collection_case.closed
