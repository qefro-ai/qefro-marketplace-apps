id: follow_up
scope: customer
name: Follow-up
description: Collection follow-up against a case, using existing channels
allocate_code:
  prefix: FU-
  start: 1001
fields:
- name: collection_case_id
  type: relation
  ref_entity: collection_case
  required: true
- name: invoice_id
  type: relation
  ref_entity: invoice
- name: customer_name
  type: string
  description: Display label only; identity is person_id
- name: channel
  type: enum
  enum_values:
  - whatsapp
  - email
  - phone
  - manual
  - other
- name: scheduled_at
  type: datetime
- name: completed_at
  type: datetime
- name: outcome
  type: enum
  enum_values:
  - no_response
  - promised_payment
  - payment_received
  - requested_extension
  - disputed
  - wrong_contact
  - other
- name: notes
  type: string
- name: status
  type: enum
  enum_values:
  - pending
  - completed
  - cancelled
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  pending: follow_up.created
  completed: follow_up.completed
