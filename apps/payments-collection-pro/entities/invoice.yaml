id: invoice
scope: customer
name: Invoice
description: Outstanding customer invoice bound to Customer Hub Person
allocate_code:
  prefix: INV-
  start: 1001
fields:
- name: invoice_number
  type: string
  unique: true
- name: customer_name
  type: string
  required: true
  description: Display label only; identity is person_id
- name: issue_date
  type: date
- name: due_date
  type: date
- name: amount
  type: float
  required: true
- name: currency
  type: string
- name: paid_amount
  type: float
- name: outstanding_amount
  type: float
- name: status
  type: enum
  enum_values:
  - draft
  - issued
  - partially_paid
  - paid
  - overdue
  - cancelled
- name: notes
  type: string
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  issued: invoice.created
  partially_paid: invoice.updated
  paid: invoice.updated
  overdue: invoice.overdue
  cancelled: invoice.updated
