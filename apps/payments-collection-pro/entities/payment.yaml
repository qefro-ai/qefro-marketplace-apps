id: payment
scope: customer
name: Payment
description: Recorded receipt against an invoice (not a payment gateway charge)
allocate_code:
  prefix: PAY-
  start: 1001
fields:
- name: payment_number
  type: string
- name: invoice_id
  type: relation
  ref_entity: invoice
  required: true
- name: customer_name
  type: string
  description: Display label only; identity is person_id
- name: amount
  type: float
  required: true
- name: currency
  type: string
- name: payment_date
  type: date
- name: payment_method
  type: enum
  enum_values:
  - cash
  - bank_transfer
  - upi
  - card
  - cheque
  - other
- name: reference
  type: string
- name: status
  type: enum
  enum_values:
  - received
  - pending
  - failed
  - reversed
- name: notes
  type: string
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  pending: payment.created
  received: payment.received
  failed: payment.failed
