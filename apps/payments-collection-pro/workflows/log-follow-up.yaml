id: log-follow-up
name: Log follow-up
description: Log a completed collection follow-up
surfaces:
- staff
trigger:
  type: conversation
constants:
  completed: completed
steps:
- id: list_cases
  type: tool
  tool: entity.collection_case.list
  execution: runtime
  output: collection_cases
  input_map:
    limit: $literal:20
- id: ask_id
  type: ask
  field: id
  message: "📞 Which collection case did you follow up?"
  choices_from: collection_cases
  title_field: customer_name
  value_field: id
  chip_prefix: case
- id: ask_channel
  type: ask
  field: channel
  message: "📡 Which channel?"
  choices:
  - id: whatsapp
    label: WhatsApp
  - id: email
    label: Email
  - id: phone
    label: Phone
  - id: manual
    label: Manual
  - id: other
    label: Other
- id: ask_outcome
  type: ask
  field: outcome
  message: "📋 Outcome?"
  choices:
  - id: no_response
    label: No response
  - id: promised_payment
    label: Promised payment
  - id: payment_received
    label: Payment received
  - id: requested_extension
    label: Requested extension
  - id: disputed
    label: Disputed
  - id: wrong_contact
    label: Wrong contact
  - id: other
    label: Other
- id: ask_notes
  type: ask
  field: notes
  message: "📝 Follow-up notes?"
- id: run
  type: tool
  tool: entity.follow_up.create
  execution: runtime
  input_map:
    collection_case_id: id
    invoice_id: invoice_id
    customer_name: customer_name
    channel: channel
    outcome: outcome
    notes: notes
    scheduled_at: scheduled_at
    status: $constants.completed
- id: confirm
  type: message
  message: "📞 Follow-up logged for collection case {{id}}."
- id: done
  type: complete
