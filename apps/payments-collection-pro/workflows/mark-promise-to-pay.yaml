id: mark-promise-to-pay
name: Mark promise to pay
description: Mark a collection case as promise to pay
surfaces:
- staff
trigger:
  type: conversation
constants:
  promise_to_pay: promise_to_pay
steps:
- id: list_cases
  type: tool
  tool: entity.collection_case.list
  execution: runtime
  output: collection_cases
  input_map:
    limit: $literal:20
- id: ask_id
  type: ask
  field: id
  message: "🤝 Which collection case has a promise to pay?"
  choices_from: collection_cases
  title_field: customer_name
  value_field: id
  chip_prefix: case
- id: ask_next_follow_up
  type: ask
  field: next_follow_up_at
  message: "📅 When should we follow up?"
- id: run
  type: tool
  tool: entity.collection_case.update
  execution: runtime
  input_map:
    id: id
    status: $constants.promise_to_pay
    next_follow_up_at: next_follow_up_at
    notes: notes
- id: confirm
  type: message
  message: "🤝 Collection case {{id}} marked promise to pay."
- id: done
  type: complete
