id: task
name: Task
fields:
- name: title
  type: string
  required: true
- name: project_id
  type: relation
  ref_entity: project
  required: true
- name: status
  type: enum
  enum_values:
  - todo
  - doing
  - done
  required: true
- name: due_date
  type: date
status_events:
  done: task.completed
