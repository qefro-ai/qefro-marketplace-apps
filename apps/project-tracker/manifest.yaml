id: project-tracker
name: Project Tracker
version: 1.2.0
hosting: runtime
description: Sample project / task / invoice app for ZIP install genericity tests
category: productivity
tags:
- projects
- tasks
- runtime
- fixture
channels:
- widget
- whatsapp
entities:
- project
- task
- invoice
flows:
- create-project
- create-task
- create-invoice
events:
- project.created
- task.created
- task.completed
- invoice.created

followup_sequences:
- id: task_completion_followup
  name: Task completion follow-up
  description: Follow up on overdue tasks until they are completed or the assignee replies.
  channel: whatsapp
  steps:
  - id: step_1
    template: task_followup_1
    delay:
      unit: hours
      value: 24
  - id: step_2
    template: task_followup_2
    delay:
      unit: days
      value: 3
  - id: step_3
    template: task_followup_3
    delay:
      unit: days
      value: 7
triggers:
- id: create_project
  workflow: create-project
  input_variable: project_input
  match:
    intents:
    - create a project
    - new project
    - start a project
    confirmation:
      reply_signals:
      - project
      - created
      required_slots:
      - name
  confirmation_message: "Project {{name}} created."
- id: create_task
  workflow: create-task
  input_variable: task_input
  match:
    intents:
    - create a task
    - add a task
    - new task
    confirmation:
      reply_signals:
      - task
      - created
      required_slots:
      - title
      - project_name
  confirmation_message: "Task {{title}} added to {{project_name}}."
- id: create_invoice
  workflow: create-invoice
  input_variable: invoice_input
  match:
    intents:
    - create an invoice
    - new invoice
    - bill for project
    confirmation:
      reply_signals:
      - invoice
      - created
      required_slots:
      - project_name
      - amount
  confirmation_message: "Invoice created for {{project_name}} amount {{amount}}."
conversation_slots:
- id: name
  labels:
  - project
  - project name
  - name
  kind: string
- id: title
  labels:
  - task
  - task title
  - title
  kind: string
- id: project_name
  labels:
  - project
  - for project
  kind: string
- id: amount
  labels:
  - amount
  - invoice amount
  - total
  kind: string
- id: status
  labels:
  - status
  kind: string
- id: due_date
  labels:
  - due date
  - deadline
  - by when
  kind: date
- id: description
  labels:
  - description
  - details
  kind: string
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
ui:
  name: Project Tracker
role_templates:
- name: Admin
  system: true
- name: Staff
  system: true
