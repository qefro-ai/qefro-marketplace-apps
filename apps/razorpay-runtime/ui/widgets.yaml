- id: intro
  type: markdown
  title: Razorpay
  options:
    content: "Metadata Marketplace App. Chat “create a payment link” runs generic Runtime HTTP against the workspace Razorpay connection. Contacts stay on Person CRM. Automations subscribe to payment.* events."
- id: order_form
  type: form
  title: "Create order"
  options:
    fields:
      - name: amount
        label: Amount
        type: number
        required: true
      - name: currency
        label: Currency
        type: text
        required: true
    submit_label: "Create order"
    action:
      trigger: create-order
- id: orders_status
  type: status
  title: Orders
  source: orders
  options:
    rows_path: items
    status_field: status
    label_field: amount
    empty_title: "Nothing yet"
- id: customers_table
  type: table
  title: Customers
  source: customers
  options:
    rows_path: items
    empty_title: "No customers yet"
    columns:
      - key: name
        header: Name
      - key: email
        header: Email
- id: orders_table
  type: table
  title: Orders
  source: orders
  options:
    rows_path: items
    empty_title: "No orders yet"
    columns:
      - key: amount
        header: Amount
      - key: status
        header: Status
- id: payments_table
  type: table
  title: Payments
  source: payments
  options:
    rows_path: items
    empty_title: "No payments yet"
    columns:
      - key: amount
        header: Amount
      - key: status
        header: Status
- id: invoices_table
  type: table
  title: Invoices
  source: invoices
  options:
    rows_path: items
    empty_title: "No invoices yet"
    columns:
      - key: amount
        header: Amount
      - key: status
        header: Status
