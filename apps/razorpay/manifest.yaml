id: razorpay
name: Razorpay
version: 0.1.2
hosting: runtime
description: Customers, orders, payments, refunds, invoices, and payment links as
  a metadata Marketplace App
category: commerce
tags:
- razorpay
- payments
- runtime
channels:
- widget
- whatsapp
connections:
- razorpay
http_tools:
- list_customers
- get_customer
- list_my_customers
- list_orders
- get_order
- create_order
- list_payments
- get_payment
- create_refund
- list_invoices
- list_payment_links
- create_payment_link
entities:
- customer
- order
- payment
- refund
- invoice
- payment_link
flows:
- create-order
- refund-payment
- create-payment-link
- list-my-customers
events:
- order.paid
- payment.created
- payment.succeeded
- payment.failed
- refund.created
- invoice.paid
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: create_order
  workflow: create-order
  input_variable: order_input
  match:
    intents:
    - create a razorpay order
    - create an order
    confirmation:
      reply_signals:
      - order
      required_slots:
      - amount
  confirmation_message: Order created for {{amount}} {{currency}}.
- id: refund_payment
  workflow: refund-payment
  input_variable: refund_input
  match:
    intents:
    - refund a razorpay payment
    - issue a refund
    confirmation:
      reply_signals:
      - refund
      required_slots:
      - id
  confirmation_message: Refund created for payment of {{amount}}.
- id: create_payment_link
  workflow: create-payment-link
  input_variable: payment_link_input
  match:
    intents:
    - create a payment link
    - share a payment link
    confirmation:
      reply_signals:
      - payment link
      required_slots:
      - amount
  confirmation_message: Payment link created for {{amount}} {{currency}}.
- id: list_my_customers
  workflow: list-my-customers
  input_variable: my_customer_list
  match:
    intents:
    - find my razorpay customer
    - my customer record
    confirmation:
      reply_signals:
      - your customer
      required_slots: []
  confirmation_message: Here is your customer record.
conversation_slots:
- id: amount
  labels:
  - amount
  - rupees
  - paise
  kind: integer
- id: currency
  labels:
  - currency
  - INR
  kind: string
- id: id
  labels:
  - payment id
  - payment
  kind: string
- id: description
  labels:
  - description
  - note
  kind: string
ui:
  name: Razorpay
