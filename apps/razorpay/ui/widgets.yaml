- id: order_form
  type: form
  title: Create order
  options:
    fields:
    - name: amount
      label: Amount
      type: number
      required: true
    - name: currency
      label: Currency
      type: text
      required: true
    submit_label: Create order
    action:
      trigger: create-order
- id: orders_status
  type: status
  title: Orders
  source: orders
  options:
    rows_path: items
    status_field: status
    label_field: amount
    empty_title: Nothing yet
- id: customers_table
  type: table
  title: Customers
  source: customers
  options:
    rows_path: items
    empty_title: No customers yet
    columns:
    - key: name
      header: Name
    - key: email
      header: Email
- id: orders_table
  type: table
  title: Orders
  source: orders
  options:
    rows_path: items
    empty_title: No orders yet
    columns:
    - key: amount
      header: Amount
    - key: status
      header: Status
- id: payments_table
  type: table
  title: Payments
  source: payments
  options:
    rows_path: items
    empty_title: No payments yet
    columns:
    - key: amount
      header: Amount
    - key: status
      header: Status
- id: invoices_table
  type: table
  title: Invoices
  source: invoices
  options:
    rows_path: items
    empty_title: No invoices yet
    columns:
    - key: amount
      header: Amount
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Razorpay
  options:
    content: Razorpay — open a list and tap New to add records.
- id: metric_order
  type: metric
  title: Orders
  source: orders
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: orders
- id: order_dash_status
  type: status
  title: Orders status
  source: orders
  options:
    rows_path: items
    status_field: status
    label_field: guest_name
    empty_title: No orders yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: orders
    action_label: View all
- id: order_dash_table
  type: table
  title: Recent Orders
  source: orders
  options:
    rows_path: items
    limit: 8
    empty_title: No orders yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: orders
    action_label: View all
    columns:
    - key: amount
      header: Amount
    - key: currency
      header: Currency
    - key: status
      header: Status
