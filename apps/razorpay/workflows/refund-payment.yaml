id: refund-payment
name: "Refund payment"
description: "Refund a Razorpay payment through generic Runtime HTTP"
surfaces:
- staff
trigger:
  type: conversation
steps:
  - id: list_payments
    type: tool
    tool: list_payments
    execution: http
    output: payments
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "💰 Which payment would you like to refund?"
    empty_message: "There are no payments available to refund right now."
    choices_from: payments
    title_field: id
    value_field: id
    chip_prefix: payment
  - id: ask_amount
    type: ask
    field: amount
    message: "💰 Refund amount in the smallest currency unit?"
  - id: run
    type: tool
    tool: create_refund
    execution: http
    input_map:
      id: id
      amount: amount
  - id: confirm
    type: message
    message: "Razorpay accepted the refund for {{amount}}."
  - id: done
    type: complete
    message: ""
