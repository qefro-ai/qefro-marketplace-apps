id: request-viewing
name: Request viewing
description: Schedule a property viewing bound to Person
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_property_title
  type: ask
  field: property_title
  message: Which property?
- id: ask_date
  type: ask
  field: date
  message: Which date and time? (e.g. tomorrow at 4pm)
- id: run
  type: tool
  tool: entity.viewing.create
  execution: runtime
  input_map:
    property_title: property_title
    date: date
    time: time
    scheduled_at: scheduled_at
    notes: notes
    status: "$literal:scheduled"
- id: confirm
  type: message
  message: Viewing scheduled for {{property_title}} on {{date}} at {{time}}.
- id: done
  type: complete
