id: reschedule-viewing
name: Reschedule viewing
description: Move a viewing to a new date/time
trigger:
  type: conversation
steps:
- id: ask_id
  type: ask
  field: id
  message: Which viewing id should we move?
- id: ask_date
  type: ask
  field: date
  message: New date?
- id: ask_time
  type: ask
  field: time
  message: New time?
- id: run
  type: tool
  tool: entity.viewing.update
  execution: runtime
  input_map:
    id: id
    date: date
    time: time
- id: confirm
  type: message
  message: Viewing {{id}} rescheduled to {{date}}.
- id: done
  type: complete
