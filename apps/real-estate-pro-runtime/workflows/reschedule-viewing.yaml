id: reschedule-viewing
name: Reschedule viewing
description: Move a viewing to a new date/time
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_id
  type: ask
  field: id
  message: Which viewing id should we move?
- id: ask_date
  type: ask
  field: date
  message: Which new date and time? (e.g. tomorrow at 4pm)
- id: run
  type: tool
  tool: entity.viewing.update
  execution: runtime
  input_map:
    id: id
    date: date
    time: time
    scheduled_at: scheduled_at
- id: confirm
  type: message
  message: Viewing {{id}} rescheduled to {{date}} at {{time}}.
- id: done
  type: complete
