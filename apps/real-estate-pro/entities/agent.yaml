id: agent
name: Agent
description: Listing or sales agent
fields:
- name: name
  type: string
  required: true
- name: email
  type: email
- name: phone
  type: phone
- name: status
  type: enum
  enum_values:
  - active
  - inactive
- name: user_id
  type: uuid
  description: Reference to the authenticated tenant member (Qefro user)
