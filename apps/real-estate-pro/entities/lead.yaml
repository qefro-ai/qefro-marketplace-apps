id: lead
scope: customer
name: Lead
description: Person-scoped sales pipeline record. Identity is Customer Hub Person, not this entity.
allocate_code:
  prefix: L-
  start: 1001
fields:
- name: person_id
  type: person
  description: Customer from Contacts. Runtime injects Hub Person; LLM/user person_id is not authority.
  ref_entity: person
  required: true
  label: Customer
- name: name
  type: string
  description: Display name auto-filled from Person. Not identity authority.
- name: source
  type: string
- name: status
  type: enum
  enum_values:
  - new
  - contacted
  - qualified
  - nurturing
  - won
  - lost
  default: new
- name: assigned_agent_name
  type: string
- name: notes
  type: string
status_events:
  contacted: lead.updated
  qualified: lead.updated
  won: lead.updated
  lost: lead.updated
