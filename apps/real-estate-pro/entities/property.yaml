id: property
name: Property
description: Listable real-estate record. Catalog mapping is declared here; Qefro does not special-case this entity at runtime.
fields:
- name: title
  type: string
  required: true
- name: description
  type: string
- name: city
  type: string
- name: property_type
  type: enum
  enum_values:
  - apartment
  - house
  - condo
  - land
  - commercial
  - other
- name: price
  type: float
- name: currency
  type: string
- name: bedrooms
  type: integer
- name: image_url
  type: image
- name: status
  type: enum
  enum_values:
  - draft
  - listed
  - sold
  - withdrawn
  default: draft
status_events:
  listed: property.status_changed
  sold: property.status_changed
  withdrawn: property.status_changed
catalog:
  enabled: true
  type: service
  mapping:
    title: title
    description: description
    price: price
    currency: currency
    image: image_url
    availability: status
  publish_when:
    field: status
    in:
    - listed
  availability:
    in_stock:
    - listed
    out_of_stock:
    - sold
    - withdrawn
