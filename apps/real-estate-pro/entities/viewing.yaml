id: viewing
scope: customer
name: Viewing
description: Property viewing appointment bound to Customer Hub Person and Property
allocate_code:
  prefix: VW-
  start: 1001
fields:
- name: person_id
  type: person
  description: Customer from Contacts. Runtime injects Hub Person; LLM/user person_id is not authority.
  ref_entity: person
  required: true
  label: Customer
- name: property_id
  type: relation
  description: Property being viewed. Must be a Property id, not a code or title.
  ref_entity: property
  required: true
- name: property_title
  type: string
  description: Display title (filled from property.title)
- name: lead_name
  type: string
  description: Display name auto-filled from Person. Not identity authority.
- name: agent_name
  type: string
- name: scheduled_at
  type: datetime
- name: date
  type: date
  required: true
- name: time
  type: string
- name: status
  type: enum
  enum_values:
  - scheduled
  - confirmed
  - completed
  - cancelled
  - no_show
- name: notes
  type: string
status_events:
  confirmed: viewing.updated
  completed: viewing.updated
  cancelled: viewing.cancelled
  no_show: viewing.updated
# Structural capability only. Operating values (timezone, duration, hours,
# closed days, date window, blocking statuses) live in settings/business.yaml
# and are overlaid per workspace installation.
#
# resource.field: property_id means one viewing at a time per property.
# If multiple agents may independently show the same property, declare
# resource.field: agent_id (or a composite) in this app metadata — do not
# guess it in platform code.
availability:
  booking:
    datetime_field: scheduled_at
  capacity:
    mode: exclusive
    resource:
      field: property_id
