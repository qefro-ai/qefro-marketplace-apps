id: real-estate-pro
name: Real Estate Pro
version: 1.2.5
hosting: runtime
description: Metadata-only real estate Marketplace App executed by Qefro Runtime (no
  SDK, no custom server)
category: real-estate
tags:
- real-estate
- viewings
- runtime
- pro
channels:
- widget
- whatsapp
entities:
- property
- property_unit
- agent
- lead
- viewing
- offer
- property_document
flows:
- search-properties
- request-viewing
- reschedule-viewing
- cancel-viewing
- create-property
- create-lead
- create-offer
events:
- property.created
- property.updated
- property.status_changed
- lead.created
- lead.updated
- viewing.created
- viewing.updated
- viewing.cancelled
- offer.created
- offer.updated
- offer.closed
automation_templates:
- id: follow_up_lead_created
  name: Follow-up when lead created
  description: Create a follow-up when a new lead is created.
  trigger:
    event: lead.created
  actions:
  - type: create_followup
    due_in_hours: 24
    note: Follow up with the new lead
- id: viewing_booked_whatsapp
  name: WhatsApp when a viewing is booked
  description: Message the workspace Person with the property, date, and time. Requires an approved WhatsApp template named viewing_reminder on this workspace.
  trigger:
    event: viewing.created
  actions:
  - type: send_whatsapp
    template: viewing_reminder
    parameters:
    - "{{person.name}}"
    - "{{entity.property_title}}"
    - "{{entity.date}}"
    - "{{entity.time}}"
    body: |
      Hi {{person.name}},

      Your viewing of {{entity.property_title}} is scheduled for {{entity.date}} at {{entity.time}}.

      Please arrive a few minutes early.

followup_sequences:
- id: lead_followup
  name: Lead follow-up
  description: Follow up with property leads until they respond or schedule a viewing.
  channel: whatsapp
  steps:
  - id: step_1
    template: lead_followup_1
    delay:
      unit: hours
      value: 24
  - id: step_2
    template: lead_followup_2
    delay:
      unit: days
      value: 3
  - id: step_3
    template: lead_followup_3
    delay:
      unit: days
      value: 7

settings:
- key: timezone
  type: string
  default: Asia/Kolkata
  description: IANA timezone for viewing slots
- key: duration_minutes
  type: number
  default: 30
  description: Viewing duration in minutes
- key: start_time
  type: string
  default: "09:00"
  description: Opening time (HH:MM, 24-hour)
- key: end_time
  type: string
  default: "18:00"
  description: Closing time (HH:MM, 24-hour)
- key: closed_days
  type: string
  default: sunday
  description: Comma-separated weekdays the office is closed
- key: date_window_days
  type: number
  default: 5
  description: How many days ahead to offer viewing slots
- key: blocking_statuses
  type: string
  default: scheduled,confirmed
  description: Viewing statuses that occupy a time slot
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: request_viewing
  workflow: request-viewing
  input_variable: viewing_input
  match:
    intents:
    - schedule a viewing
    - book a viewing
    - arrange a viewing
    - view the property
    - book to visit
    - book a visit
    - visit
    - visit property
    - site visit
    - book visit
    - schedule visit
    confirmation:
      reply_signals:
      - viewing
      - visit
      - site visit
      - scheduled
      - booked
      required_slots:
      - property_title
  confirmation_message: Viewing scheduled for {{property_title}} on {{date}}.
- id: reschedule_viewing
  workflow: reschedule-viewing
  input_variable: viewing_reschedule
  match:
    intents:
    - reschedule my viewing
    - move my viewing
    confirmation:
      reply_signals:
      - rescheduled
      required_slots:
      - id
      - date
  confirmation_message: Viewing {{property_title}} rescheduled to {{date}}.
- id: cancel_viewing
  workflow: cancel-viewing
  input_variable: viewing_cancel
  match:
    intents:
    - cancel my viewing
    - cancel the viewing
    confirmation:
      reply_signals:
      - cancelled
      required_slots:
      - id
  confirmation_message: Viewing {{property_title}} cancelled.
- id: search_properties
  workflow: search-properties
  input_variable: property_search
  match:
    intents:
    - search properties
    - show listings
    - browse properties
conversation_slots:
- id: property_type
  labels:
  - property type
  - apartment
  - villa
  - commercial
  kind: string
- id: city
  labels:
  - city
  - area
  - location
  - San Francisco
  kind: string
- id: property_title
  labels:
  - property
  - listing
  - address
  kind: string
- id: lead_name
  labels:
  - lead
  - visitor
  - name
  - guest
  kind: person_name
  identity: person_name
- id: name
  labels:
  - name
  kind: person_name
  identity: person_name
- id: agent_name
  labels:
  - agent
  - realtor
  kind: string
- id: date
  labels:
  - date
  - tomorrow
  - Saturday
  kind: date
- id: time
  labels:
  - time
  kind: time
  chip_prefix: time
- id: id
  labels:
  - viewing
  - viewing id
  kind: string
- id: amount
  labels:
  - amount
  - offer
  - price
  kind: string
- id: phone
  labels:
  - phone
  - mobile
  kind: phone
- id: email
  labels:
  - email
  kind: email
- id: source
  labels:
  - source
  kind: string
ui:
  name: Real Estate Pro
  navigation_layout: sidebar
