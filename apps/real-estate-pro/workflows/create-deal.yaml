id: create-deal
name: Create deal
description: Open a deal from an offer or negotiation
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: ask_property_title
  type: ask
  field: property_title
  message: Which property?
- id: ask_lead_name
  type: ask
  field: lead_name
  message: Lead name?
- id: run
  type: tool
  tool: entity.deal.create
  execution: runtime
  input_map:
    property_title: property_title
    lead_name: lead_name
    agent_name: agent_name
    offer_code: offer_code
    amount: amount
    currency: currency
- id: confirm
  type: message
  message: Deal created for {{property_title}}.
- id: done
  type: complete
