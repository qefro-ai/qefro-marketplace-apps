id: create-lead
name: Create lead
description: Open a pipeline record for an existing Customer Hub Person
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: ask_source
  type: ask
  field: source
  message: "📎 Lead source?"
- id: ask_notes
  type: ask
  field: notes
  message: "📝 Notes (optional)?"
- id: run
  type: tool
  tool: entity.lead.create
  execution: runtime
  input_map:
    source: source
    notes: notes
    assigned_agent_name: assigned_agent_name
    status: $literal:new
- id: confirm
  type: message
  message: "✅ Pipeline lead created."
- id: done
  type: complete
