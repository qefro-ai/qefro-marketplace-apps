id: create-offer
name: Create offer
description: Submit an offer on a property for the Hub Person
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: list_properties
  type: tool
  tool: entity.property.list
  execution: runtime
  output: properties
  input_map:
    filter.status: $literal:listed
    limit: $literal:20
- id: ask_property
  type: ask
  field: property_id
  message: "🏠 Which property?"
  choices_from: properties
  title_field: title
  value_field: id
  chip_prefix: property
- id: get_property
  type: tool
  tool: entity.property.get
  execution: runtime
  output: property
  input_map:
    id: property_id
- id: list_viewings
  type: tool
  tool: entity.viewing.list
  execution: runtime
  output: viewings
  input_map:
    filter.property_id: property_id
    limit: $literal:20
- id: ask_viewing
  type: ask
  field: viewing_id
  message: "Who is this offer for?"
  choices_from: viewings
  title_field: code
  value_field: id
  chip_prefix: viewing
- id: get_viewing
  type: tool
  tool: entity.viewing.get
  execution: runtime
  output: viewing
  input_map:
    id: viewing_id
- id: ask_amount
  type: ask
  field: amount
  message: "💰 Offer amount?"
- id: run
  type: tool
  tool: entity.offer.create
  execution: runtime
  input_map:
    person_id: viewing.person_id
    property_id: property_id
    property_title: property.title
    amount: amount
    currency: property.currency
    status: $literal:submitted
- id: confirm
  type: message
  message: "✅ Offer submitted for {{property_title}}."
- id: done
  type: complete
