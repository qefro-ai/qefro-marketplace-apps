id: create-offer
name: Create offer
description: Submit an offer on a property
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: ask_property_title
  type: ask
  field: property_title
  message: Which property?
- id: ask_lead_name
  type: ask
  field: lead_name
  message: Lead name?
- id: ask_amount
  type: ask
  field: amount
  message: Offer amount?
- id: run
  type: tool
  tool: entity.offer.create
  execution: runtime
  input_map:
    property_title: property_title
    lead_name: lead_name
    amount: amount
    currency: currency
- id: confirm
  type: message
  message: Offer submitted for {{property_title}}.
- id: done
  type: complete
