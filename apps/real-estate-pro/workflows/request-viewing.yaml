id: request-viewing
name: Request viewing
description: Schedule a property viewing bound to Person
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: list_properties
  type: tool
  tool: entity.property.list
  execution: runtime
  output: properties
  input_map:
    filter.status: $literal:listed
    limit: $literal:20
- id: ask_property
  type: ask
  field: property_id
  message: "🏠 Which property?"
  choices_from: properties
  title_field: title
  value_field: id
  chip_prefix: property
- id: get_property
  type: tool
  tool: entity.property.get
  execution: runtime
  output: property
  input_map:
    id: property_id
- id: ask_date
  type: ask
  field: date
  message: "📅 Which date?"
- id: ask_time
  type: ask
  field: time
  message: "⏰ What time works best for you?"
- id: run
  type: tool
  tool: entity.viewing.create
  execution: runtime
  input_map:
    property_id: property_id
    property_title: property.title
    date: date
    time: time
    scheduled_at: scheduled_at
    status: $literal:scheduled
- id: confirm
  type: message
  message: "✅ Viewing scheduled for {{property_title}} on {{date}} at {{time}}."
- id: done
  type: complete
