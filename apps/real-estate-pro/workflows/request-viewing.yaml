id: request-viewing
name: Request viewing
description: Schedule a property viewing bound to Person
surfaces:
- customer
whatsapp_flow:
  category: APPOINTMENT_BOOKING
  title: Request viewing
  cta: Request
trigger:
  type: conversation
steps:
- id: list_properties
  type: tool
  tool: entity.property.list
  execution: runtime
  output: properties
  input_map:
    filter.status: $literal:listed
    limit: $literal:20
- id: ask_property
  type: ask
  field: property_id
  message: "🏠 Which property?"
  choices_from: properties
  title_field: title
  value_field: id
  chip_prefix: property
- id: get_property
  type: tool
  tool: entity.property.get
  execution: runtime
  output: property
  input_map:
    id: property_id
- id: list_dates
  type: tool
  tool: entity.viewing.availability
  execution: runtime
  output: available_dates
  input_map:
    kind: $literal:dates
    property_id: property_id
- id: ask_date
  type: ask
  field: date
  message: "📅 Choose a date"
  choices_from: available_dates
  title_field: label
  value_field: value
  chip_prefix: date
- id: list_slots
  type: tool
  tool: entity.viewing.availability
  execution: runtime
  output: available_slots
  input_map:
    kind: $literal:slots
    date: date
    property_id: property_id
- id: ask_time
  type: ask
  field: time
  message: "⏰ Choose a time"
  choices_from: available_slots
  title_field: label
  value_field: time
  chip_prefix: time
- id: validate_slot
  type: tool
  tool: entity.viewing.availability
  execution: runtime
  output: slot_check
  input_map:
    kind: $literal:validate
    date: date
    time: time
    property_id: property_id
- id: run
  type: tool
  tool: entity.viewing.create
  execution: runtime
  input_map:
    property_id: property_id
    property_title: property.title
    date: date
    time: time
    scheduled_at: scheduled_at
    status: $literal:scheduled
- id: confirm
  type: message
  message: "✅ Viewing scheduled for {{property_title}} on {{date}} at {{time}}."
- id: done
  type: complete
