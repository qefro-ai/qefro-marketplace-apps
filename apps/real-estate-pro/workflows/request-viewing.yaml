id: request-viewing
name: Request viewing
description: Schedule a property viewing bound to Person
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_property_title
  type: ask
  field: property_title
  message: "🏠 Which property?"
- id: ask_date
  type: ask
  field: date
  message: "📅 Which date?"
- id: run
  type: tool
  tool: entity.viewing.create
  execution: runtime
  input_map:
    property_title: property_title
    agent_name: agent_name
    date: date
    time: time
    notes: notes
    status: $literal:scheduled
- id: confirm
  type: message
  message: "✅ Viewing scheduled for {{property_title}} on {{date}}."
- id: done
  type: complete
