id: reschedule-viewing
name: Reschedule viewing
description: Move a viewing to a new date/time
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: list_viewings
  type: tool
  tool: entity.viewing.list
  execution: runtime
  output: viewings
  input_map:
    filter.status: $literal:scheduled
    limit: $literal:20
- id: ask_id
  type: ask
  field: id
  message: Which viewing would you like to reschedule?
  choices_from: viewings
  title_field: property_name
  value_field: id
  chip_prefix: viewing
- id: ask_date
  type: ask
  field: date
  message: New date?
- id: ask_time
  type: ask
  field: time
  message: New time?
- id: run
  type: tool
  tool: entity.viewing.update
  execution: runtime
  input_map:
    id: id
    date: date
    time: time
- id: confirm
  type: message
  message: Viewing {{id}} rescheduled to {{date}}.
- id: done
  type: complete
