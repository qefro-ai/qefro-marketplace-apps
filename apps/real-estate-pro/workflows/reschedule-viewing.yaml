id: reschedule-viewing
name: Reschedule viewing
description: Move a viewing to a new date/time
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: list_viewings
  type: tool
  tool: entity.viewing.list
  execution: runtime
  output: viewings
  input_map:
    filter.status: $literal:scheduled
    limit: $literal:20
- id: ask_id
  type: ask
  field: id
  message: "🔄 Which viewing would you like to reschedule?"
  empty_message: "You have no upcoming viewings to reschedule."
  choices_from: viewings
  title_field: property_title
  value_field: id
  chip_prefix: viewing
- id: get_viewing
  type: tool
  tool: entity.viewing.get
  execution: runtime
  output: viewing
  input_map:
    id: id
- id: list_dates
  type: tool
  tool: entity.viewing.availability
  execution: runtime
  output: available_dates
  input_map:
    kind: $literal:dates
    property_id: viewing.property_id
- id: ask_date
  type: ask
  field: date
  message: "📅 Choose a date"
  empty_message: "There are no open dates for viewings right now."
  choices_from: available_dates
  title_field: label
  value_field: value
  chip_prefix: date
- id: list_slots
  type: tool
  tool: entity.viewing.availability
  execution: runtime
  output: available_slots
  input_map:
    kind: $literal:slots
    date: date
    property_id: viewing.property_id
- id: ask_time
  type: ask
  field: time
  message: "⏰ Choose a time"
  empty_message: "There are no open slots on that date."
  choices_from: available_slots
  title_field: label
  value_field: time
  chip_prefix: time
- id: validate_slot
  type: tool
  tool: entity.viewing.availability
  execution: runtime
  output: slot_check
  input_map:
    kind: $literal:validate
    date: date
    time: time
    property_id: viewing.property_id
- id: run
  type: tool
  tool: entity.viewing.update
  execution: runtime
  input_map:
    id: id
    date: date
    time: time
    scheduled_at: scheduled_at
- id: confirm
  type: message
  message: "🔄 Viewing {{property_title}} rescheduled to {{date}} at {{time}}."
- id: done
  type: complete
