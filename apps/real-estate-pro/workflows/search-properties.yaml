id: search-properties
name: Search properties
description: List properties for staff or public browsing
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_type
  type: ask
  field: property_type
  message: "🔍 What type of property are you looking for?"
  choices:
  - id: apartment
    label: Apartment
  - id: house
    label: Villa / House
  - id: condo
    label: Condo
  - id: land
    label: Plot / Land
  - id: commercial
    label: Commercial
- id: ask_city
  type: ask
  field: city
  message: "📍 Which city or area should I search in?"
  choices:
  - id: Mumbai
    label: Mumbai
  - id: Delhi
    label: Delhi
  - id: Bangalore
    label: Bangalore
  - id: Hyderabad
    label: Hyderabad
  - id: Chennai
    label: Chennai
  - id: Kolkata
    label: Kolkata
  - id: Pune
    label: Pune
  - id: Goa
    label: Goa
- id: run
  type: tool
  tool: entity.property.list
  execution: runtime
  input_map:
    filter.property_type: property_type
    filter.city: city
- id: confirm
  type: message
  message: |
    🔍 **Matching Properties**
    {{items_text}}
  choices:
  - id: request_viewing
    label: Schedule a viewing
  - id: search_properties
    label: Search again

- id: done
  type: complete
  message: ""
