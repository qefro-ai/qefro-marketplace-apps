id: viewing
name: Viewing
description: Scheduled visit to a property
allocate_code:
  prefix: V-
  start: 1001
fields:
  - name: property_title
    type: string
    required: true
    description: Listing title or code
  - name: lead_name
    type: string
    required: true
  - name: date
    type: date
    required: true
  - name: time
    type: string
    description: Preferred viewing time
  - name: status
    type: enum
    enum_values:
      - scheduled
      - completed
      - cancelled
      - no_show
  - name: person_id
    type: person
    ref_entity: person
    description: Existing Qefro Person identity
