# Real Estate — metadata Marketplace App (hosting: runtime).
# Different primitives from Restaurant Pro (property / lead / viewing).
# Same installer, FlowRunner, RuntimeAdapter, events, and storage. No SDK process.

id: real-estate-runtime
name: Real Estate
version: 0.1.0
hosting: runtime
description: Property listings, leads, and viewings as a metadata Marketplace App
category: real-estate
tags:
  - real-estate
  - viewings
  - runtime
channels:
  - widget
  - whatsapp
entities:
  - property
  - lead
  - viewing
flows:
  - create-viewing
events:
  - viewing.created
permissions:
  - workflow.execute
  - storage.read
  - storage.write
  - storage.update
  - storage.delete
capabilities:
  - theme.get
  - user.get
  - tenant.get
  - runtime.query
  - workflow.trigger
  - storage.read
  - storage.write
triggers:
  - id: schedule_viewing
    workflow: create-viewing
    input_variable: viewing_input
    match:
      intents:
        - schedule a viewing
        - book a viewing
        - arrange a viewing
        - view the property
      confirmation:
        reply_signals:
          - viewing
          - scheduled
          - booked
        required_slots:
          - property_title
          - date
    confirmation_message: "Viewing scheduled for {{property_title}} on {{date}}."
conversation_slots:
  - id: property_title
    labels: [property, listing, address]
    kind: string
  - id: lead_name
    labels: [lead, visitor, name, guest]
    kind: person_name
    identity: person_name
  - id: date
    labels: [date, tomorrow, Saturday]
    kind: date
  - id: time
    labels: [time]
    kind: time
    chip_prefix: time
ui:
  name: Real Estate
