- id: intro
  type: markdown
  title: Real Estate
  options:
    content: |
      Metadata Marketplace App. Properties, leads, and viewings persist in
      Qefro-managed storage. Chat “Schedule a viewing tomorrow” starts
      **create-viewing** on the shared FlowRunner (RuntimeAdapter). Contacts
      stay on the existing Person CRM.

- id: property_detail
  type: markdown
  title: Listing
  options:
    content: |
      Open a row on **Properties** to inspect a listing. Status on this page
      is the same generic `status` widget used by any runtime app — not a
      real-estate engine.

- id: viewing_form
  type: form
  title: New viewing
  options:
    fields:
      - { name: property_title, label: Property, type: text, required: true }
      - { name: lead_name, label: Visitor, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: time, label: Time, type: time, required: false }
    submit_label: Schedule viewing
    action:
      trigger: create-viewing

- id: properties_table
  type: table
  title: Properties
  source: properties
  options:
    rows_path: items
    empty_title: No listings yet
    empty_subtitle: Add a property from storage or another flow.
    columns:
      - { key: title, header: Title }
      - { key: address, header: Address }
      - { key: price, header: Price }
      - { key: status, header: Status }

- id: properties_status
  type: status
  title: Listings
  source: properties
  options:
    rows_path: items
    status_field: status
    label_field: title
    empty_title: No listings yet

- id: leads_table
  type: table
  title: Leads
  source: leads
  options:
    rows_path: items
    empty_title: No leads yet
    columns:
      - { key: name, header: Name }
      - { key: phone, header: Phone }
      - { key: email, header: Email }

- id: viewings_table
  type: table
  title: Viewings
  source: viewings
  options:
    rows_path: items
    empty_title: No viewings yet
    empty_subtitle: Schedule from chat or the form on Viewings.
    columns:
      - { key: property_title, header: Property }
      - { key: lead_name, header: Visitor }
      - { key: date, header: Date }
      - { key: time, header: Time }
      - { key: status, header: Status }
