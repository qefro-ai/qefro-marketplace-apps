id: menu_item
name: Menu item
description: Sellable menu item
fields:
- name: category_name
  type: string
- name: name
  type: string
  required: true
- name: description
  type: string
- name: price
  type: float
  required: true
- name: currency
  type: string
- name: image_url
  type: url
- name: availability
  type: enum
  enum_values:
  - available
  - sold_out
  - seasonal
- name: status
  type: enum
  enum_values:
  - active
  - inactive
status_events:
  active: menu_item.updated
  inactive: menu_item.updated
