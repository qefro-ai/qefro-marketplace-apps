id: lookup-reservation
name: Lookup reservation
description: Fetch one reservation by id
surfaces:
- customer
trigger:
  type: conversation
steps:
- id: ask_id
  type: ask
  field: id
  message: Which reservation id?
- id: run
  type: tool
  tool: entity.reservation.get
  execution: runtime
  input_map:
    id: id
- id: confirm
  type: message
  message: |
    Here is reservation {{id}}.
    {{items_text}}

- id: done
  type: complete
  message: ""
