id: update-order-status
name: Update order status
description: Advance or change order status
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: ask_id
  type: ask
  field: id
  message: Which order id?
- id: ask_status
  type: ask
  field: status
  message: New status?
- id: run
  type: tool
  tool: entity.order.update
  execution: runtime
  input_map:
    id: id
    status: status
- id: confirm
  type: message
  message: Order {{id}} updated to {{status}}.
- id: done
  type: complete
