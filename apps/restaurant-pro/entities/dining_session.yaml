id: dining_session
scope: customer
name: Dining session
description: Active table seating session
allocate_code:
  prefix: DS-
  start: 1001
fields:
- name: table_id
  type: relation
  description: Table being seated
  ref_entity: table
  required: true
- name: table_name
  type: string
  description: Display name (filled from table.name)
- name: guest_name
  type: string
- name: guest_count
  type: integer
- name: started_at
  type: datetime
- name: status
  type: enum
  enum_values:
  - open
  - ordering
  - dining
  - closed
  default: open
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
ui:
  form:
    hidden:
    - table_name
