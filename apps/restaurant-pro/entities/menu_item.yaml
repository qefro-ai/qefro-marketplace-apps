id: menu_item
name: Menu item
description: Sellable menu item
fields:
- name: category_id
  type: relation
  description: Menu category this item belongs to
  ref_entity: menu_category
- name: category_name
  type: string
  description: Display name (filled from menu_category.name)
- name: name
  type: string
  required: true
- name: description
  type: string
- name: price
  type: float
  format: currency
  required: true
- name: currency
  type: string
- name: image
  type: image
  description: Menu item photo uploaded via the generic solution media field
- name: availability
  type: enum
  enum_values:
  - available
  - sold_out
  - seasonal
- name: status
  type: enum
  enum_values:
  - active
  - inactive
  default: active
status_events:
  active: menu_item.updated
  inactive: menu_item.updated
title_field: name
status_field: status
views:
- type: table
  columns:
  - name
  - category_name
  - price
  - availability
- type: tile
  title_field: name
  status_field: status
ui:
  style: modern
  form:
    hidden:
    - category_name
  list:
    default_view: tile
    empty_state:
      title: Menu is empty
      description: Add dishes and drinks so they can be ordered.
      action_label: New menu item
  detail:
    layout: stack
    hero:
      title_field: name
      subtitle_field: category_name
      status_field: status
      image_field: image
    metrics:
    - price
catalog:
  enabled: true
  type: product
  mapping:
    title: name
    description: description
    price: price
    currency: currency
    image: image
    availability: availability
  publish_when:
    field: status
    in:
    - active
  availability:
    in_stock:
    - available
    - seasonal
    out_of_stock:
    - sold_out
