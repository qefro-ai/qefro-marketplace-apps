id: order
scope: customer
name: Order
description: Dining or takeaway order bound to Person
allocate_code:
  prefix: O-
  start: 1001
delete:
  mode: restrict
concurrency: optimistic
fields:
- name: code
  type: string
  unique: true
- name: order_type
  type: enum
  description: Dine-in (table) or takeaway (pickup)
  enum_values:
  - dine_in
  - takeaway
  default: dine_in
- name: guest_name
  type: string
- name: table_id
  type: relation
  description: Table for dine-in orders. Leave empty for takeaway.
  ref_entity: table
- name: table_name
  type: string
  description: Display name (filled from table.name)
- name: reservation_id
  type: relation
  description: Optional reservation this order is linked to
  ref_entity: reservation
- name: reservation_code
  type: string
  description: Display code (filled from reservation.code)
- name: notes
  type: string
  description: Pickup notes or special instructions
- name: pickup_date
  type: date
  description: Requested pickup date for takeaway orders
- name: pickup_time
  type: string
  description: Requested pickup time for takeaway orders (HH:MM)
- name: status
  type: enum
  enum_values:
  - pending
  - confirmed
  - preparing
  - ready
  - completed
  - cancelled
- name: total_amount
  type: float
- name: currency
  type: string
- name: created_at
  type: datetime
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  confirmed: order.updated
  preparing: order.updated
  ready: order.ready
  completed: order.completed
  cancelled: order.cancelled
computed:
  # Empty child rollup does not overwrite an explicit total on the order's
  # own create. Child mutations rewrite including 0.
- field: total_amount
  op: relation_sum
  relation: order_item
  foreign_key: order_id
  sum_field: amount
title_field: code
status_field: status
views:
- type: table
  columns:
  - code
  - order_type
  - guest_name
  - table_name
  - pickup_date
  - status
  - total_amount
- type: tile
  title_field: code
  status_field: status
ui:
  style: modern
  form:
    hidden:
    - table_name
    - reservation_code
    - code
    - total_amount
  list:
    default_view: table
    empty_state:
      title: No orders yet
      description: Create a dine-in or takeaway order from POS or New order.
      action_label: New order
  detail:
    layout: split
    hero:
      title_field: code
      subtitle_field: guest_name
      status_field: status
    metrics:
    - total_amount
    - order_type
    - pickup_date
    - pickup_time