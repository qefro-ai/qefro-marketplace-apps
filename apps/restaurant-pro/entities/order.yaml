id: order
scope: customer
name: Order
description: Dining or takeaway order bound to Person
allocate_code:
  prefix: O-
  start: 1001
fields:
- name: code
  type: string
  unique: true
- name: guest_name
  type: string
- name: table_name
  type: string
- name: reservation_code
  type: string
- name: status
  type: enum
  enum_values:
  - pending
  - confirmed
  - preparing
  - ready
  - completed
  - cancelled
- name: total_amount
  type: float
- name: currency
  type: string
- name: created_at
  type: datetime
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  confirmed: order.updated
  preparing: order.updated
  ready: order.updated
  completed: order.completed
  cancelled: order.cancelled
computed:
  # Empty child rollup does not overwrite an explicit total on the order's
  # own create. Child mutations rewrite including 0.
- field: total_amount
  op: relation_sum
  relation: order_item
  foreign_key: order_id
  sum_field: amount
