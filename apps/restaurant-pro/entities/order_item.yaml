id: order_item
name: Order item
description: Line item on an order. Unit price is the amount charged at sale time.
concurrency: optimistic
fields:
- name: order_id
  type: relation
  ref_entity: order
  required: true
- name: order_code
  type: string
  description: Optional denormalized parent code for display. Relation is order_id.
- name: menu_item_id
  type: relation
  ref_entity: menu_item
- name: menu_item_name
  type: string
  required: true
- name: quantity
  type: integer
  required: true
- name: unit_price
  type: float
- name: amount
  type: float
- name: notes
  type: string
computed:
- field: amount
  op: multiply
  left: quantity
  right: unit_price
