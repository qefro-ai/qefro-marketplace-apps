id: payment
scope: customer
name: Payment
description: Payment for a Restaurant Order
allocate_code:
  prefix: PAY-
  start: 1001
concurrency: optimistic
fields:
- name: order_id
  type: relation
  ref_entity: order
  required: true
- name: order_code
  type: string
  description: Optional denormalized parent code for display. Relation is order_id.
- name: guest_name
  type: string
- name: amount
  type: float
  required: true
- name: currency
  type: string
- name: method
  type: enum
  enum_values:
  - cash
  - card
  - upi
- name: status
  type: enum
  default: pending
  enum_values:
  - pending
  - completed
  - failed
  - refunded
- name: paid_at
  type: datetime
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
  inherit_from: order_id
status_events:
  completed: payment.received
  failed: payment.created
  refunded: payment.created
# Creates start pending. Staff mark a cash tender completed; that emits
# payment.received. Card and UPI do not confirm an order until a captured
# provider payment covers the total.
state_machine:
  status_field: status
  initial: pending
  initial_state: pending
  states:
  - id: pending
    name: pending
  - id: completed
    name: completed
  - id: failed
    name: failed
    terminal: true
    final: true
  - id: refunded
    name: refunded
    terminal: true
    final: true
  transitions:
  - from: pending
    to: completed
    roles:
    - owner
    - admin
    - member
    - org:admin
  - from: pending
    to: failed
  - from: completed
    to: refunded
on_events:
- event: payment.received
  target: order
  match_field: id
  match_from: order_id
  where:
    status: pending
  set:
    status: confirmed
  limit: 50
relation_caps:
- field: amount
  relation: order_id
  parent_field: total_amount
ui:
  form:
    hidden:
    - order_code
