id: payment
scope: customer
name: Payment
description: Payment for a Restaurant Order
allocate_code:
  prefix: PAY-
  start: 1001
fields:
- name: order_id
  type: relation
  ref_entity: order
- name: order_code
  type: string
  required: true
- name: guest_name
  type: string
- name: amount
  type: float
  required: true
- name: currency
  type: string
- name: method
  type: enum
  enum_values:
  - cash
  - card
  - upi
- name: status
  type: enum
  enum_values:
  - pending
  - completed
  - failed
  - refunded
- name: paid_at
  type: datetime
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  completed: payment.created
  failed: payment.created
  refunded: payment.created
