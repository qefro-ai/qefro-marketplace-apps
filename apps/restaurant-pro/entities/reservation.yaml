id: reservation
scope: customer
name: Reservation
description: Table reservation bound to Person
allocate_code:
  prefix: R-
  start: 1001
fields:
- name: guest_name
  type: string
  required: true
- name: table_id
  type: relation
  ref_entity: table
- name: table_name
  type: string
- name: guest_count
  type: integer
  required: true
- name: reservation_at
  type: datetime
- name: date
  type: date
  required: true
- name: time
  type: string
- name: status
  type: enum
  enum_values:
  - pending
  - confirmed
  - seated
  - cancelled
  - completed
  - no_show
- name: notes
  type: string
- name: person_id
  type: person
  description: Existing Qefro Person identity (Customer Hub)
  ref_entity: person
status_events:
  confirmed: reservation.updated
  seated: reservation.updated
  cancelled: reservation.cancelled
  completed: reservation.updated
  no_show: reservation.updated
availability:
  booking:
    datetime_field: reservation_at
  capacity:
    mode: exclusive
    resource:
      field: table_id
title_field: guest_name
status_field: status
views:
- type: table
- type: tile
  title_field: guest_name
  status_field: status
ui:
  style: classic
  list:
    default_view: table
    empty_state:
      title: No reservations
      description: Book a table for a guest already in Contacts.
      action_label: New reservation
  detail:
    layout: split
    hero:
      title_field: guest_name
      subtitle_field: person_id
      status_field: status
    metrics:
    - guest_count
    - reservation_at

