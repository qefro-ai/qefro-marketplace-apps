id: staff_member
name: Staff member
description: Restaurant staff roster
fields:
- name: name
  type: string
  required: true
- name: role
  type: string
- name: email
  type: email
- name: phone
  type: phone
- name: status
  type: enum
  enum_values:
  - active
  - inactive
  - on_leave
- name: user_id
  type: uuid
  description: Reference to the authenticated tenant member (Qefro user)
