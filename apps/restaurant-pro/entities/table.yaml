id: table
name: Table
description: Dining table
fields:
- name: restaurant_name
  type: string
- name: name
  type: string
  required: true
- name: capacity
  type: integer
  required: true
- name: location
  type: string
- name: status
  type: enum
  enum_values:
  - available
  - held
  - occupied
  - out_of_service
status_events:
  held: reservation.updated
  occupied: reservation.updated
  available: reservation.updated
