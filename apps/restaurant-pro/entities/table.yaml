id: table
name: Table
description: Dining table
fields:
- name: name
  type: string
  required: true
- name: capacity
  type: integer
  required: true
- name: location
  type: string
  description: Floor area or section (e.g. patio, window)
- name: status
  type: enum
  enum_values:
  - available
  - held
  - occupied
  - out_of_service
  default: available
status_events:
  held: reservation.updated
  occupied: reservation.updated
  available: reservation.updated
title_field: name
status_field: status
