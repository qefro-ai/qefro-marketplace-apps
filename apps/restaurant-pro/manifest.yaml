id: restaurant-pro
name: Restaurant Pro
version: 1.9.4
hosting: runtime
description: Metadata-only restaurant operations Marketplace App executed by Qefro
  Runtime (no SDK, no custom server)
category: hospitality
tags:
- restaurant
- reservations
- takeaway
- offers
- runtime
- pro
channels:
- widget
- whatsapp
entities:
- restaurant
- table
- menu_category
- menu_item
- customer
- reservation
- order
- order_item
- offer
- staff_member
- dining_session
- payment
flows:
- book-table
- cancel-reservation
- lookup-reservation
- create-order
- create-takeaway-order
- create-offer
- update-order-status
- browse-menu
- check-table-availability
- create-restaurant
- create-table
- create-menu-category
- create-customer
- create-staff-member
events:
- reservation.created
- reservation.updated
- reservation.cancelled
- order.created
- order.updated
- order.completed
- order.ready
- order.cancelled
- offer.created
- offer.updated
- offer.sent
- payment.created
- payment.received
- customer.created
- menu_item.created
- menu_item.updated
- restaurant.created
- table.created
- menu_category.created
- staff_member.created
automation_templates:
- id: notify_team_order_created
  name: Notify team when order created
  description: Alert the team when a new order is created.
  trigger:
    event: order.created
  actions:
  - type: notify_team
    message: New order {{entity.code}} ({{entity.total_amount}})
- id: order_ready_whatsapp
  name: WhatsApp when an order is ready
  description: Message the workspace Person when an order is ready. Requires an approved WhatsApp template named order_ready on this workspace.
  trigger:
    event: order.ready
  actions:
  - type: send_whatsapp
    template: order_ready
    parameters:
    - "{{person.name}}"
    - "{{entity.code}}"
    - "{{entity.total_amount}}"
    body: |
      Hi {{person.name}},

      Your order {{entity.code}} is now ready for pickup.

      Total amount: {{entity.total_amount}}

      Thank you for dining with us! Please show this message at the counter when collecting your order.
- id: offer_message_whatsapp
  name: WhatsApp offer message
  description: Message the workspace Person when an offer is created. Requires an approved WhatsApp template named offer_message on this workspace.
  trigger:
    event: offer.created
  actions:
  - type: send_whatsapp
    template: offer_message
    parameters:
    - "{{person.name}}"
    - "{{entity.title}}"
    - "{{entity.message}}"
    - "{{entity.promo_code}}"
    - "{{entity.valid_until}}"
    body: |
      Hi {{person.name}},

      We have an exciting special offer for you: {{entity.title}}!

      Here are the details of this offer:
      {{entity.message}}

      Use promo code {{entity.promo_code}} when placing your order to claim this discount. This special offer is valid until {{entity.valid_until}}.

      Reply BOOK to reserve a table or TAKEAWAY to order pickup. We look forward to welcoming you soon!

followup_sequences:
- id: reservation_followup
  name: Reservation follow-up
  description: Follow up with guests who missed their reservation to rebook or collect feedback.
  channel: whatsapp
  steps:
  - id: step_1
    template: reservation_followup_1
    delay:
      unit: hours
      value: 24
  - id: step_2
    template: reservation_followup_2
    delay:
      unit: days
      value: 3
  - id: step_3
    template: reservation_followup_3
    delay:
      unit: days
      value: 7

permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
