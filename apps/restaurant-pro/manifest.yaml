triggers:
- id: book_table
  workflow: book-table
  input_variable: reservation_input
  match:
    intents:
    - book table
    - book a table
    - reserve table
    - reserve a table
    - table booking
    - make a reservation
    - table for
    confirmation:
      reply_signals:
      - reservation
      - booked
      - table booked
      required_slots:
      - guest_count
      - date
  confirmation_message: Reservation booked for {{guest_count}} on {{date}}.
- id: cancel_reservation
  workflow: cancel-reservation
  input_variable: reservation_cancel
  match:
    intents:
    - cancel my reservation
    - cancel the booking
    confirmation:
      reply_signals:
      - cancelled
      required_slots:
      - id
  confirmation_message: Reservation for {{guest_name}} cancelled.
- id: lookup_reservation
  workflow: lookup-reservation
  input_variable: reservation_lookup
  match:
    intents:
    - find my reservation
    - reservation status
    confirmation:
      reply_signals:
      - reservation
      required_slots:
      - id
  confirmation_message: Here is reservation for {{guest_name}}.
- id: browse_menu
  workflow: browse-menu
  input_variable: menu_browse
  match:
    intents:
    - show the menu
    - browse the menu
    - what is on the menu
    confirmation:
      reply_signals:
      - menu
      required_slots: []
  confirmation_message: |
    Here is the current menu.
    {{items_text}}
- id: takeaway_order
  workflow: create-takeaway-order
  input_variable: takeaway_input
  match:
    intents:
    - takeaway
    - takeaway order
    - pickup order
    - order for pickup
    - to go
    confirmation:
      reply_signals:
      - takeaway
      - pickup
      - order
      required_slots:
      - guest_name
  confirmation_message: Takeaway order started for {{guest_name}}.
conversation_slots:
- id: guest_name
