- id: reservation_form
  type: form
  title: Book table
  options:
    fields:
    - name: guest_name
      label: Guest name
      type: text
      required: true
    - name: guest_count
      label: Party size
      type: text
      required: true
    - name: date
      label: Date
      type: date
      required: true
    - name: time
      label: Time
      type: time
      required: false
    - name: table_name
      label: Table
      type: text
      required: false
    - name: notes
      label: Notes
      type: text
      required: false
    submit_label: Book
    action:
      trigger: book-table
- id: order_form
  type: form
  title: Create order
  options:
    fields:
    - name: guest_name
      label: Guest name
      type: text
      required: false
    - name: table_name
      label: Table
      type: text
      required: false
    - name: total_amount
      label: Total
      type: text
      required: false
    - name: currency
      label: Currency
      type: text
      required: false
    submit_label: Create
    action:
      trigger: create-order
- id: reservations_status
  type: status
  title: Reservations
  source: reservations
  options:
    rows_path: items
    status_field: status
    label_field: guest_name
    empty_title: No reservations yet
- id: reservations_table
  type: table
  title: Reservations
  source: reservations
  options:
    rows_path: items
    empty_title: No reservations yet
    columns:
    - key: guest_name
      header: Guest
    - key: guest_count
      header: Covers
    - key: date
      header: Date
    - key: status
      header: Status
- id: tables_table
  type: table
  title: Tables
  source: tables
  options:
    rows_path: items
    empty_title: No tables yet
    columns:
    - key: name
      header: Name
    - key: capacity
      header: Capacity
    - key: status
      header: Status
- id: menu_table
  type: table
  title: Menu
  source: menu_items
  options:
    rows_path: items
    empty_title: No menu items yet
    columns:
    - key: name
      header: Item
    - key: category_name
      header: Category
    - key: price
      header: Price
    - key: availability
      header: Availability
- id: orders_table
  type: table
  title: Orders
  source: orders
  options:
    rows_path: items
    empty_title: No orders yet
    columns:
    - key: guest_name
      header: Guest
    - key: table_name
      header: Table
    - key: status
      header: Status
    - key: total_amount
      header: Total
- id: customers_table
  type: table
  title: Customers
  source: customers
  options:
    rows_path: items
    empty_title: No customers yet
    columns:
    - key: name
      header: Name
    - key: phone
      header: Phone
    - key: email
      header: Email
- id: staff_table
  type: table
  title: Staff
  source: staff
  options:
    rows_path: items
    empty_title: No staff yet
    columns:
    - key: name
      header: Name
    - key: role
      header: Role
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Restaurant Pro
  options:
    content: Reservations, tables, menu, and orders — open a list and tap New to add
      records.
- id: metric_reservation
  type: metric
  title: Reservations
  source: reservations
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: reservations
- id: metric_table
  type: metric
  title: Tables
  source: tables
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: tables
- id: metric_order
  type: metric
  title: Orders
  source: orders
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: orders
- id: metric_menu_item
  type: metric
  title: Menu items
  source: menu_items
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: menu_items
- id: reservation_dash_status
  type: status
  title: Reservations status
  source: reservations
  options:
    rows_path: items
    status_field: status
    label_field: guest_name
    empty_title: No reservations yet
    empty_subtitle: Open the list and tap New to add your first record.
    navigate_to: reservations
    action_label: View all
- id: reservation_dash_table
  type: table
  title: Recent Reservations
  source: reservations
  options:
    rows_path: items
    limit: 8
    columns:
    - key: guest_name
      header: Guest Name
    - key: table_name
      header: Table Name
    - key: guest_count
      header: Guest Count
    - key: reservation_at
      header: Reservation At
    - key: date
      header: Date
    navigate_to: reservations
    action_label: View all
    empty_title: No reservations yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
