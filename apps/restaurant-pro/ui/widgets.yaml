- id: pos_checkout
  type: cart_checkout
  title: Restaurant POS
  options:
    catalog_entity: menu_item
    catalog_title_field: name
    catalog_price_field: price
    catalog_category_field: category_name
    catalog_category_entity: menu_category
    catalog_availability_field: availability
    catalog_unavailable_values:
    - sold_out
    catalog_filter:
      status: active
    line_entity: order_item
    line_parent_field: order_id
    line_parent_code_field: order_code
    line_catalog_field: menu_item_id
    line_qty_field: quantity
    line_price_field: unit_price
    line_description_field: menu_item_name
    document_entity: order
    document_status: pending
    document_status_field: status
    document_person_field: person_id
    document_total_field: total_amount
    document_number_field: code
    document_currency_field: currency
    document_guest_field: guest_name
    document_table_field: table_name
    document_page: orders
    person_required: false
    table_entity: table
    table_label_field: name
    payment_entity: payment
    payment_amount_field: amount
    payment_method_field: method
    payment_status: completed
    payment_status_field: status
    payment_date_field: paid_at
    payment_person_field: person_id
    payment_currency_field: currency
    payment_document_field: order_code
    payment_document_id_field: order_id
    payment_guest_field: guest_name
    payment_methods:
    - cash
    - card
    - upi
    submit_label: Complete order
    new_label: New order
    cart_title: Current order
- id: reservation_form
  type: form
  title: Book table
  options:
    fields:
    - name: guest_name
      label: Guest name
      type: text
      required: true
    - name: guest_count
      label: Party size
      type: text
      required: true
    - name: date
      label: Date
      type: date
      required: true
    - name: time
      label: Time
      type: time
      required: false
    - name: table_name
      label: Table
      type: text
      required: false
    - name: notes
      label: Notes
      type: text
      required: false
    submit_label: Book
    action:
      trigger: book-table
- id: order_form
  type: form
  title: Create order
  options:
    fields:
    - name: guest_name
      label: Guest name
      type: text
      required: false
    - name: table_name
      label: Table
      type: text
      required: false
    - name: total_amount
      label: Total
      type: text
      required: false
    - name: currency
      label: Currency
      type: text
      required: false
    submit_label: Create
    action:
      trigger: create-order
- id: reservations_status
  type: status
  title: Reservations
  source: reservations
  options:
    rows_path: items
    status_field: status
    label_field: guest_name
    empty_title: No reservations yet
- id: reservations_table
  type: table
  title: Reservations
  source: reservations
  options:
    rows_path: items
    empty_title: No reservations yet
    columns:
    - key: guest_name
      header: Guest
    - key: guest_count
      header: Covers
    - key: date
      header: Date
    - key: status
      header: Status
- id: tables_table
  type: table
  title: Tables
  source: tables
  options:
    rows_path: items
    empty_title: No tables yet
    columns:
    - key: name
      header: Name
    - key: capacity
      header: Capacity
    - key: status
      header: Status
- id: menu_table
  type: table
  title: Menu
  source: menu_items
  options:
    rows_path: items
    empty_title: No menu items yet
    columns:
    - key: name
      header: Item
    - key: category_name
      header: Category
    - key: price
      header: Price
    - key: availability
      header: Availability
- id: orders_table
  type: table
  title: Orders
  source: orders
  options:
    rows_path: items
    empty_title: No orders yet
    columns:
    - key: guest_name
      header: Guest
    - key: table_name
      header: Table
    - key: status
      header: Status
    - key: total_amount
      header: Total
- id: customers_table
  type: table
  title: Customers
  source: customers
  options:
    rows_path: items
    empty_title: No customers yet
    columns:
    - key: name
      header: Name
    - key: phone
      header: Phone
    - key: email
      header: Email
- id: staff_table
  type: table
  title: Staff
  source: staff
  options:
    rows_path: items
    empty_title: No staff yet
    columns:
    - key: name
      header: Name
    - key: role
      header: Role
    - key: status
      header: Status
- id: intro
  type: markdown
  title: Restaurant Pro
  options:
    content: Reservations, tables, menu, and orders — open a list and tap New to add
      records.
- id: metric_reservation
  type: metric
  title: Reservations
  source: reservations
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: reservations
- id: metric_table
  type: metric
  title: Tables
  source: tables
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: tables
- id: metric_order
  type: metric
  title: Orders
  source: orders
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: orders
- id: metric_menu_item
  type: metric
  title: Menu items
  source: menu_items
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: menu_items
- id: reservation_dash_status
  type: status
  title: Reservations status
  source: reservations
  options:
    rows_path: items
    status_field: status
    label_field: guest_name
    empty_title: No reservations yet
    empty_subtitle: Open the list and tap New to add your first record.
    navigate_to: reservations
    action_label: View all
- id: reservation_dash_table
  type: table
  title: Recent Reservations
  source: reservations
  options:
    rows_path: items
    limit: 8
    columns:
    - key: guest_name
      header: Guest Name
    - key: table_name
      header: Table Name
    - key: guest_count
      header: Guest Count
    - key: reservation_at
      header: Reservation At
    - key: date
      header: Date
    navigate_to: reservations
    action_label: View all
    empty_title: No reservations yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
- id: restaurant_form
  type: form
  title: Add restaurant
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: address
      label: Address
      type: text
      required: false
    - name: phone
      label: Phone
      type: text
      required: false
    submit_label: Add
    action:
      trigger: create-restaurant
- id: table_form
  type: form
  title: Add table
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: capacity
      label: Capacity
      type: number
      required: true
    submit_label: Add
    action:
      trigger: create-table
- id: menu_category_form
  type: form
  title: Add category
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    submit_label: Add
    action:
      trigger: create-menu-category
- id: customer_form
  type: form
  title: Add customer
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: phone
      label: Phone
      type: text
      required: false
    - name: email
      label: Email
      type: text
      required: false
    submit_label: Add
    action:
      trigger: create-customer
- id: staff_form
  type: form
  title: Add staff
  options:
    fields:
    - name: name
      label: Name
      type: text
      required: true
    - name: role
      label: Role
      type: text
      required: false
    - name: phone
      label: Phone
      type: text
      required: false
    submit_label: Add
    action:
      trigger: create-staff-member
