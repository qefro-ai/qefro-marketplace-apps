id: create-restaurant
name: "Add restaurant"
description: "Register a new restaurant location"
surfaces:
- staff
trigger:
  type: conversation
steps:
  - id: ask_name
    type: ask
    field: name
    message: "🍽️ Restaurant name?"
  - id: ask_address
    type: ask
    field: address
    message: "📍 Address?"
  - id: ask_phone
    type: ask
    field: phone
    message: "📞 Phone?"
  - id: run
    type: tool
    tool: entity.restaurant.create
    execution: runtime
    input_map:
      name: name
      address: address
      phone: phone
  - id: confirm
    type: message
    message: "🍽️ Restaurant {{name}} registered."
  - id: done
    type: complete
