id: list-my-orders
name: My orders
description: View your recent orders
surfaces:
- customer
whatsapp_flow:
  category: OTHER
  title: My orders
  cta: View orders
trigger:
  type: conversation
steps:
- id: list_orders
  type: tool
  tool: entity.order.list
  execution: runtime
  output: orders
  input_map:
    limit: $literal:10
- id: ask_order
  type: ask
  field: id
  message: "📋 Here are your recent orders. Which order would you like to view?"
  empty_message: "You don't have any recent orders right now."
  choices_from: orders
  title_fields:
  - code
  - status
  - total_amount
  title_field: code
  value_field: id
  chip_prefix: order
- id: get_order
  type: tool
  tool: entity.order.get
  execution: runtime
  output: selected_order
  input_map:
    id: id
- id: confirm
  type: message
  message: |
    📋 **Order #{{selected_order.code}}**
    • Status: {{selected_order.status}}
    • Type: {{selected_order.order_type}}
    • Total: {{selected_order.total_amount}}

    💡 To cancel an active takeaway order, reply "Cancel order" or select Cancel takeaway order.
- id: done
  type: complete
