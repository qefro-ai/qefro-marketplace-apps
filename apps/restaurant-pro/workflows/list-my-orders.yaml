id: list-my-orders
name: My orders
description: View and manage your recent orders
surfaces:
- customer
whatsapp_flow:
  category: OTHER
  title: My orders
  cta: View orders
trigger:
  type: conversation
steps:
- id: list_orders
  type: tool
  tool: entity.order.list
  execution: runtime
  output: orders
  input_map:
    limit: $literal:10
- id: ask_order
  type: ask
  field: id
  message: "📋 Here are your recent orders. Which order would you like to manage?"
  empty_message: "You don't have any recent orders right now."
  choices_from: orders
  title_fields:
  - code
  - status
  - total_amount
  title_field: code
  value_field: id
  chip_prefix: order
- id: get_order
  type: tool
  tool: entity.order.get
  execution: runtime
  output: selected_order
  input_map:
    id: id
- id: check_status
  type: condition
  when: selected_order.status == 'cancelled' || selected_order.status == 'completed'
  then: msg_terminal
  else: check_preparing
- id: check_preparing
  type: condition
  when: selected_order.status == 'preparing' || selected_order.status == 'ready'
  then: msg_in_kitchen
  else: ask_action
- id: msg_terminal
  type: message
  message: "Order {{selected_order.code}} is {{selected_order.status}} (Total: {{selected_order.total_amount}}) and cannot be modified."
- id: goto_done_terminal
  type: condition
  when: "true"
  then: done
  else: done
- id: msg_in_kitchen
  type: message
  message: "Order {{selected_order.code}} is currently {{selected_order.status}} and being prepared. It can no longer be modified or cancelled."
- id: goto_done_kitchen
  type: condition
  when: "true"
  then: done
  else: done
- id: ask_action
  type: ask
  field: action
  message: "Order {{selected_order.code}} is {{selected_order.status}} (Total: {{selected_order.total_amount}}).\nWhat would you like to do?"
  choices:
  - id: cancel
    label: Cancel Order
  - id: update
    label: Update Order
- id: branch_action
  type: condition
  when: action == 'cancel' || action == 'Cancel Order'
  then: check_cancel_type
  else: ask_update_time
- id: check_cancel_type
  type: condition
  when: selected_order.order_type == 'takeaway'
  then: do_cancel
  else: msg_cannot_cancel_dine_in
- id: msg_cannot_cancel_dine_in
  type: message
  message: "Only takeaway orders can be cancelled online. Please speak to your server to update dine-in orders."
- id: goto_done_dine_in
  type: condition
  when: "true"
  then: done
  else: done
- id: do_cancel
  type: tool
  tool: entity.order.update
  execution: runtime
  input_map:
    id: id
    status: $literal:cancelled
- id: msg_cancelled
  type: message
  message: "❌ Order {{selected_order.code}} has been cancelled."
- id: goto_done_cancel
  type: condition
  when: "true"
  then: done
  else: done
- id: ask_update_time
  type: ask
  field: pickup_time
  input_type: time
  message: "⏰ What is your updated pickup time?"
- id: do_update
  type: tool
  tool: entity.order.update
  execution: runtime
  input_map:
    id: id
    pickup_time: pickup_time
- id: msg_updated
  type: message
  message: "✅ Order {{selected_order.code}} updated. Your pickup time is now {{pickup_time}}."
- id: done
  type: complete
