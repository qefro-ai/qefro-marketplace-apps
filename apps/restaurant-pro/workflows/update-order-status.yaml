id: update-order-status
name: Update order status
description: Move an open order through confirmed, preparing, ready, or completed. Payment does not complete the order.
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: list_orders
  type: tool
  tool: entity.order.list
  execution: runtime
  output: orders
  input_map:
    limit: $literal:20
- id: ask_id
  type: ask
  field: id
  message: "📋 Which order would you like to update?"
  empty_message: "You have no orders to update right now."
  choices_from: orders
  title_field: code
  value_field: id
  chip_prefix: order
- id: ask_status
  type: ask
  field: status
  message: "🔄 New status? Payment confirms an order. Preparing, ready, and completed are kitchen steps."
  choices:
  - confirmed
  - preparing
  - ready
  - completed
  - cancelled
- id: run
  type: tool
  tool: entity.order.update
  execution: runtime
  input_map:
    id: id
    status: status
- id: confirm
  type: message
  message: "🔄 Order {{code}} updated to {{status}}."
- id: done
  type: complete
