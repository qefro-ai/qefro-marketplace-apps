id: update-order
name: Update order
description: Change pickup details for your active takeaway order
surfaces:
- customer
whatsapp_flow:
  category: OTHER
  title: Update order
  cta: Update
trigger:
  type: conversation
steps:
- id: list_orders
  type: tool
  tool: entity.order.list
  execution: runtime
  output: orders
  input_map:
    filter.status: $literal:pending
    limit: $literal:10
- id: ask_id
  type: ask
  field: id
  message: "📋 Which order would you like to update?"
  empty_message: "You have no pending orders that can be updated."
  choices_from: orders
  title_fields:
  - code
  - status
  - total_amount
  title_field: code
  value_field: id
  chip_prefix: order
- id: get_order
  type: tool
  tool: entity.order.get
  execution: runtime
  output: selected_order
  input_map:
    id: id
- id: check_editable
  type: condition
  when: selected_order.status == 'pending' || selected_order.status == 'confirmed'
  then: ask_pickup_time
  else: reject_non_editable
- id: reject_non_editable
  type: message
  message: "Order {{selected_order.code}} is {{selected_order.status}} and cannot be modified."
- id: goto_done_non_editable
  type: condition
  when: "true"
  then: done
  else: done
- id: ask_pickup_time
  type: ask
  field: pickup_time
  input_type: time
  message: "⏰ What is your updated pickup time?"
- id: ask_notes
  type: ask
  field: notes
  message: "📝 Any additional notes or special instructions?"
- id: do_update
  type: tool
  tool: entity.order.update
  execution: runtime
  input_map:
    id: id
    pickup_time: pickup_time
    notes: notes
- id: confirm
  type: message
  message: "✅ Order {{selected_order.code}} updated. Pickup time is set to {{pickup_time}}."
- id: done
  type: complete
