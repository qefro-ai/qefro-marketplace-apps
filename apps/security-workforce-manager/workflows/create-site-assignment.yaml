id: create-site-assignment
name: Create site assignment history
surfaces:
- staff
trigger:
  type: conversation
steps:
- id: select_employee_id
  type: tool
  tool: entity.employee.list
  execution: runtime
  output: select_employee_id
- id: ask_employee_id
  type: ask
  field: employee_id
  message: Enter employee id.
  choices_from: select_employee_id
  value_field: id
  title_field: full_name
  empty_message: No related records available. Create the related record first.
- id: select_site_id
  type: tool
  tool: entity.duty_site.list
  execution: runtime
  output: select_site_id
- id: ask_site_id
  type: ask
  field: site_id
  message: Enter site id.
  choices_from: select_site_id
  value_field: id
  title_field: name
  empty_message: No related records available. Create the related record first.
- id: ask_start_date
  type: ask
  field: start_date
  message: Enter start date.
- id: save
  type: tool
  tool: entity.site_assignment.create
  execution: runtime
  input_map:
    employee_id: employee_id
    site_id: site_id
    start_date: start_date
    end_date: end_date
    reason: reason
    status: $literal:planned
- id: done
  type: complete
