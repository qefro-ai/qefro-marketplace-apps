id: search_products
description: Search the catalog when the customer names or shortens a product (for example Hydrogen). Pass that text as query.
connection: shopify
method: GET
path: /admin/api/2024-10/products.json
query:
  title: "{query}"
pagination:
  style: query
  limit_param: limit
  default_limit: 20
  max_limit: 50
response:
  items: products
  choice_id_prefix: product
required_scopes:
  - read_products
timeout_seconds: 15
