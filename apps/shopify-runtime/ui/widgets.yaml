- id: intro
  type: markdown
  title: Shopify
  options:
    content: |
      Metadata Marketplace App. Chat “find black shoes” or “show my recent
      orders” runs generic Runtime HTTP tools against the workspace Shopify
      connection (no SDK, no Shopify client in this package). Contacts stay
      on the existing Person CRM. Staff tables below are schema views.

- id: product_search
  type: form
  title: Search products
  options:
    fields:
      - { name: query, label: Search, type: text, required: true }
    submit_label: Search
    action:
      trigger: search-products

- id: products_table
  type: table
  title: Products
  source: products
  options:
    rows_path: items
    empty_title: No products yet
    empty_subtitle: Add products in storage or search from chat.
    columns:
      - { key: title, header: Title }
      - { key: product_type, header: Type }
      - { key: price, header: Price }
      - { key: status, header: Status }

- id: product_detail
  type: markdown
  title: Product
  options:
    content: |
      Open a row on **Products** to inspect a catalog item. Search uses the
      generic HTTP tool `search_products` (RuntimeAdapter → HTTP executor).

- id: customers_table
  type: table
  title: Customers
  source: customers
  options:
    rows_path: items
    empty_title: No customers yet
    columns:
      - { key: name, header: Name }
      - { key: email, header: Email }
      - { key: phone, header: Phone }

- id: customer_detail
  type: markdown
  title: Customer
  options:
    content: |
      Open a row on **Customers** for detail. `person_id` binds to the
      platform Person CRM — this app does not own contacts.

- id: orders_table
  type: table
  title: Orders
  source: orders
  options:
    rows_path: items
    empty_title: No orders yet
    empty_subtitle: Chat “show my recent orders” lists via generic Runtime HTTP.
    columns:
      - { key: order_number, header: Order }
      - { key: customer_name, header: Customer }
      - { key: total, header: Total }
      - { key: status, header: Status }

- id: order_detail
  type: markdown
  title: Order
  options:
    content: |
      Open a row on **Orders** for detail. `order.created` /
      `order.updated` / `order.cancelled` are CRM business events on the
      existing bus — not a Shopify webhook.

- id: orders_status
  type: status
  title: Orders
  source: orders
  options:
    rows_path: items
    status_field: status
    label_field: order_number
    empty_title: No orders yet
