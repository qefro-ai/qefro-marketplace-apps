id: order
provider_mirror: Shopify
scope: customer
name: Order
description: Qefro record shape for an order. Saving it does not create a Shopify order. Live orders come from the connected store through workflows.
allocate_code:
  prefix: O-
  start: 1001
fields:
  - name: order_number
    type: string
    description: Display order number
  - name: customer_name
    type: string
  - name: email
    type: email
  - name: total
    type: float
  - name: currency
    type: string
  - name: status
    type: enum
    enum_values:
      - pending
      - paid
      - fulfilled
      - cancelled
  - name: person_id
    type: person
    ref_entity: person
    description: Existing Qefro Person identity (never a store-local CRM)
