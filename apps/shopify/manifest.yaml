id: shopify
name: Shopify
version: 0.2.2
hosting: runtime
description: Products, customers, and orders as a metadata Marketplace App executed
  by Qefro Runtime HTTP
category: commerce
tags:
- shopify
- commerce
- runtime
channels:
- widget
- whatsapp
connections:
- shopify
http_tools:
- search_products
- list_products
- get_product
- list_customers
- get_customer
- list_orders
- get_order
- list_my_orders
- get_my_order
entities:
- product
- customer
- order
- collection
- variant
- order_line_item
flows:
- search-products
- list-recent-orders
- list-my-orders
- get-my-order
events:
- order.created
- order.updated
- order.cancelled
- customer.created
- customer.updated

followup_sequences:
- id: order_followup
  name: Order follow-up
  description: Follow up with customers after their order is fulfilled to collect feedback or offer support.
  channel: whatsapp
  steps:
  - id: step_1
    template: order_followup_1
    delay:
      unit: hours
      value: 24
  - id: step_2
    template: order_followup_2
    delay:
      unit: days
      value: 3
  - id: step_3
    template: order_followup_3
    delay:
      unit: days
      value: 7

permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: search_products
  workflow: search-products
  input_variable: product_query
  match:
    intents:
    - find black shoes
    - search products
    - find a product
    - look up products
    - search the catalog
    confirmation:
      reply_signals:
      - products matching
      required_slots:
      - query
  confirmation_message: Products matching {{query}}.
- id: list_recent_orders
  workflow: list-recent-orders
  input_variable: order_list
  match:
    intents:
    - list all orders
    - list shop orders
    - staff recent orders
    confirmation:
      reply_signals:
      - recent shop orders
      required_slots: []
  confirmation_message: Here are the recent shop orders.
- id: list_my_orders
  workflow: list-my-orders
  input_variable: my_order_list
  match:
    intents:
    - show my recent orders
    - list recent orders
    - show orders
    - recent orders
    - my orders
    - where is my order
    confirmation:
      reply_signals:
      - your recent orders
      required_slots: []
  confirmation_message: Here are your recent orders.
- id: get_my_order
  workflow: get-my-order
  input_variable: order_number
  match:
    intents:
    - where is order
    - status of order
    - look up order
    - find order number
    confirmation:
      reply_signals:
      - that order
      required_slots:
      - order_number
  confirmation_message: Here is that order.
conversation_slots:
- id: query
  labels:
  - product
  - shoes
  - black
  - search
  - find
  - catalog
  kind: string
- id: product_title
  labels:
  - product
  - title
  - name
  kind: string
- id: order_id
  labels:
  - order
  - order number
  kind: string
- id: order_number
  labels:
  - order
  - order number
  kind: string
ui:
  name: Shopify
