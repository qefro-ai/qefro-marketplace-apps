id: list-my-orders
name: List my orders
description: Show the authenticated customer's own orders through generic Runtime HTTP
trigger:
  type: conversation
steps:
  - id: list
    type: tool
    tool: list_my_orders
    execution: http
  - id: confirm
    type: message
    message: |
      🛒 **Your Recent Orders**
      {{items_text}}
  - id: done
    type: complete
    message: ""
