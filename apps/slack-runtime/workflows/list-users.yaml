id: list-users
name: "List users"
description: "List Slack users through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: run
    type: tool
    tool: list_users
    execution: http
  - id: confirm
    type: message
    message: |
      Here are the users.
      {{items_text}}
  - id: done
    type: complete
    message: ""
