id: slack
auth_type: bearer
oauth:
  authorization_url: "https://slack.com/oauth/v2/authorize"
  token_url: "https://slack.com/api/oauth.v2.access"
  revoke_url: "https://slack.com/api/auth.revoke"
  revoke_method: POST
  api_host: slack.com
  token_auth_method: client_secret_post
  client_id_source: workspace
  client_secret_source: workspace
  scope_separator: ","
  scopes:
    - "channels:read"
    - "users:read"
    - "chat:write"
    - "channels:history"
webhooks:
  hmac:
    algorithm: hmac-sha256
    encoding: hex
    header: X-Slack-Signature
    key_source: app_client
  signature:
    algorithm: hmac-sha256
    source: header
    header: X-Slack-Signature
    format: prefixed
    encoding: hex
    prefix: v0=
    timestamp_header: X-Slack-Request-Timestamp
    signed_payload: "v0:{timestamp}:{body}"
    max_skew_seconds: 300
  identity:
    source: header
    header: X-Slack-Team-Id
  identity_header: X-Slack-Team-Id
  topic:
    source: header
    header: X-Slack-Event
  topic_header: X-Slack-Event
  event_id_header: X-Slack-Request-Id
  topics:
    message.channels: channel.message
    channel_created: channel.created
    app_mention: notification.created
