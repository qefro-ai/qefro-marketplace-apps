id: list_channels
description: "Staff-only channel list"
connection: slack
method: GET
path: "/api/conversations.list"
timeout_seconds: 15
pagination:
  style: query
  limit_param: limit
  default_limit: 20
  max_limit: 50
response:
  items: channels
required_scopes:
  - "channels:read"
access:
  surfaces:
    - staff
