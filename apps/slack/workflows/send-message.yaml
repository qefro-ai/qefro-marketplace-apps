id: send-message
name: "Send message"
description: "Post to Slack through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: ask_channel
    type: ask
    field: channel
    message: "Which channel id or name?"
  - id: ask_text
    type: ask
    field: text
    message: "What should we post?"
  - id: run
    type: tool
    tool: send_message
    execution: http
    input_map:
      channel: channel
      text: text
  - id: confirm
    type: message
    message: "Message sent to {{channel}}."
  - id: done
    type: complete
    message: ""
