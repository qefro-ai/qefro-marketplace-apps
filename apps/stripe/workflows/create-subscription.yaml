id: create-subscription
name: "Create subscription"
description: "Create a Stripe subscription through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: ask_stripe_customer
    type: ask
    field: stripe_customer
    message: "💳 Which Stripe customer id should we subscribe?"
  - id: ask_price_id
    type: ask
    field: price_id
    message: "💳 Which price id?"
  - id: run
    type: tool
    tool: create_subscription
    execution: http
    input_map:
      stripe_customer: stripe_customer
      price_id: price_id
  - id: confirm
    type: message
    message: "✅ Subscription created for {{stripe_customer}}."
  - id: done
    type: complete
    message: ""
