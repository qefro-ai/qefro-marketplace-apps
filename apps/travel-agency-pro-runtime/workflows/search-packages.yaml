id: search-packages
name: Search Packages
description: Search available travel packages by destination and preferences
surfaces:
- customer

trigger:
  type: conversation

steps:
- id: ask_destination
  type: ask
  field: destination
  message: "Where would you like to travel? (e.g., Dubai, Maldives, Istanbul)"

- id: ask_date
  type: ask
  field: travel_date
  message: "When are you planning to travel?"

- id: ask_travelers
  type: ask
  field: travelers_count
  message: "How many travelers?"

- id: search
  type: tool
  tool: entity.travel_package.list
  execution: runtime
  input_map:
    filter.status: $literal:active
    limit: $literal:20
  output: packages

- id: show_results
  type: message
  message: |
    Here are available packages for {{destination}}:

    {{packages}}

    Would you like details on any specific package?

- id: done
  type: complete
  message: ""
