id: cancel-booking
name: Cancel Booking
description: Cancel a travel booking
surfaces:
- customer

trigger:
  type: conversation

constants:
  cancelled: cancelled

steps:
- id: ask_reference
  type: ask
  field: booking_reference
  message: "Please provide the booking reference you want to cancel."

- id: lookup
  type: tool
  tool: entity.booking.list
  execution: runtime
  input_map:
    filter.booking_reference: booking_reference
    limit: $literal:1
  output: booking

- id: cancel
  type: tool
  tool: entity.booking.update
  execution: runtime
  input_map:
    id: booking.id
    status: $constants.cancelled
  output: updated

- id: show_result
  type: message
  message: |
    Your booking has been cancelled.

    Booking Reference: {{booking.booking_reference}}
    Status: Cancelled

    If you have any questions, please contact our support team.

- id: done
  type: complete
  message: ""
