id: create-booking
name: Create Booking
description: Create a new travel booking
surfaces:
- customer

trigger:
  type: conversation

steps:
- id: list_packages
  type: tool
  tool: entity.travel_package.list
  execution: runtime
  output: packages
  input_map:
    filter.status: $literal:active
    limit: $literal:20

- id: ask_package
  type: ask
  field: package_code
  message: "✈️ Which package would you like to book?"
  choices_from: packages
  title_field: name
  value_field: code
  chip_prefix: package

- id: get_package
  type: tool
  tool: entity.travel_package.get
  execution: runtime
  output: package
  input_map:
    id: package_code

- id: ask_date
  type: ask
  field: travel_date
  message: "📅 When would you like to travel?"

- id: ask_travelers
  type: ask
  field: travelers_count
  message: "👤 How many travelers?"

- id: create_traveler
  type: tool
  tool: entity.traveler.create
  execution: runtime
  input_map:
    person_id: $context.person_id
  output: traveler

- id: create_booking
  type: tool
  tool: entity.booking.create
  execution: runtime
  input_map:
    person_id: $context.person_id
    traveler: traveler.id
    travel_package: package_code
    travel_date: travel_date
    travelers_count: travelers_count
    status: $literal:pending
  output: booking

- id: show_confirmation
  type: message
  message: |
    ✅ **Booking Created!**

    📋 **Reference:** {{booking.booking_reference}}
    ✈️ **Package:** {{package.name}}
    📅 **Travel Date:** {{travel_date}}
    👤 **Travelers:** {{travelers_count}}
    📋 **Status:** Pending

    Our team will confirm your booking shortly. You will receive a notification once confirmed.

- id: done
  type: complete
  message: ""
