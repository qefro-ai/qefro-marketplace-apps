id: create-itinerary
name: Create Itinerary
description: Create a travel itinerary for a booking
surfaces:
- staff

trigger:
  type: conversation

steps:
- id: ask_booking
  type: ask
  field: booking_reference
  message: "Booking reference for this itinerary?"

- id: lookup_booking
  type: tool
  tool: entity.booking.list
  execution: runtime
  input_map:
    filter.booking_reference: booking_reference
    limit: $literal:1
  output: booking

- id: ask_title
  type: ask
  field: title
  message: "Itinerary title?"

- id: ask_start
  type: ask
  field: start_date
  message: "Itinerary start date?"

- id: ask_end
  type: ask
  field: end_date
  message: "Itinerary end date?"

- id: create
  type: tool
  tool: entity.itinerary.create
  execution: runtime
  input_map:
    person_id: booking.person_id
    booking: booking.id
    title: title
    start_date: start_date
    end_date: end_date
    status: $literal:draft
  output: itinerary

- id: show_result
  type: message
  message: |
    Itinerary created!

    Code: {{itinerary.code}}
    Title: {{itinerary.title}}
    Status: Draft

- id: done
  type: complete
  message: ""
