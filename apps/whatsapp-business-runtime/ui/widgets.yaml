- id: intro
  type: markdown
  title: "WhatsApp Business"
  options:
    content: "Metadata Marketplace App for Meta Cloud API. This is not Qefro WhatsApp channel ingest. Staff send tools; inbound and status arrive as Business Events from webhooks. Surface restrictions stay staff or customer in metadata — never channel branches."
- id: send_form
  type: form
  title: "Send template"
  options:
    fields:
      - name: phone_number_id
        label: "Phone number id"
        type: text
        required: true
      - name: destination_number
        label: "Destination number"
        type: text
        required: true
      - name: template_name
        label: Template
        type: text
        required: true
      - name: language
        label: Language
        type: text
        required: true
    submit_label: Send
    action:
      trigger: send-template-message
- id: messages_status
  type: status
  title: Outbound
  source: messages
  options:
    rows_path: items
    status_field: status
    label_field: destination_number
    empty_title: "Nothing yet"
- id: templates_table
  type: table
  title: Templates
  source: templates
  options:
    rows_path: items
    empty_title: "No templates yet"
    columns:
      - key: name
        header: Name
      - key: status
        header: Status
- id: messages_table
  type: table
  title: Outbound
  source: messages
  options:
    rows_path: items
    empty_title: "No outbound yet"
    columns:
      - key: destination_number
        header: To
      - key: status
        header: Status
- id: contacts_table
  type: table
  title: "WA contacts"
  source: wa_contacts
  options:
    rows_path: items
    empty_title: "No wa contacts yet"
    columns:
      - key: name
        header: Name
      - key: wa_id
        header: "WA id"
