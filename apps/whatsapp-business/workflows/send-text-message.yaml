id: send-text-message
name: "Send text message"
description: "Send a WhatsApp text through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: ask_phone_number_id
    type: ask
    field: phone_number_id
    message: "💬 Which phone-number id should send?"
  - id: ask_destination_number
    type: ask
    field: destination_number
    message: "💬 Destination WhatsApp number?"
  - id: ask_body
    type: ask
    field: body
    message: "💬 Message text?"
  - id: run
    type: tool
    tool: send_text_message
    execution: http
    input_map:
      phone_number_id: phone_number_id
      destination_number: destination_number
      body: body
  - id: confirm
    type: message
    message: "✅ Message sent to {{destination_number}}."
  - id: done
    type: complete
    message: ""
