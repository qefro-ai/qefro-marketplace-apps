id: woocommerce-runtime
name: WooCommerce
version: 0.1.1
hosting: runtime
description: Products, customers, orders, coupons, categories, and inventory as a
  metadata Marketplace App
category: commerce
tags:
- woocommerce
- commerce
- runtime
channels:
- widget
- whatsapp
connections:
- woocommerce
http_tools:
- search_products
- list_products
- get_product
- update_inventory
- list_customers
- get_customer
- list_orders
- get_order
- list_my_orders
- get_my_order
- list_coupons
- list_categories
entities:
- product
- customer
- order
- coupon
- category
flows:
- search-products
- get-customer-orders
- get-order
- update-inventory
events:
- order.created
- order.updated
- order.cancelled
- customer.created
- product.updated
- coupon.created
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: search_products
  workflow: search-products
  input_variable: product_query
  match:
    intents:
    - find a product
    - search products
    - search the catalog
    confirmation:
      reply_signals:
      - products matching
      required_slots:
      - query
  confirmation_message: Products matching {{query}}.
- id: list_my_orders
  workflow: get-customer-orders
  input_variable: my_order_list
  match:
    intents:
    - show my recent orders
    - my orders
    - where is my order
    confirmation:
      reply_signals:
      - your recent orders
      required_slots: []
  confirmation_message: Here are your recent orders.
- id: get_my_order
  workflow: get-order
  input_variable: order_id
  match:
    intents:
    - status of order
    - look up order
    confirmation:
      reply_signals:
      - that order
      required_slots:
      - id
  confirmation_message: Here is that order.
- id: update_inventory
  workflow: update-inventory
  input_variable: inventory_input
  match:
    intents:
    - update stock
    - update inventory
    confirmation:
      reply_signals:
      - inventory updated
      required_slots:
      - id
      - stock_quantity
  confirmation_message: Inventory updated for product {{id}}.
conversation_slots:
- id: query
  labels:
  - product
  - search
  - find
  - catalog
  kind: string
- id: id
  labels:
  - order
  - order id
  - product id
  kind: string
- id: stock_quantity
  labels:
  - stock
  - quantity
  - inventory
  kind: integer
ui:
  name: WooCommerce
