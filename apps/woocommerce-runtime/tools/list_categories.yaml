id: list_categories
description: "List product categories"
connection: woocommerce
method: GET
path: "/wp-json/wc/v3/products/categories"
timeout_seconds: 15
pagination:
  style: query
  limit_param: per_page
  default_limit: 20
  max_limit: 50
response:
  items: categories
access:
  surfaces:
    - staff
    - customer
