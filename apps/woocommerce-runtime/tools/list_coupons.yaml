id: list_coupons
description: "Staff-only coupon list on the workspace HTTP connection"
connection: woocommerce
method: GET
path: "/wp-json/wc/v3/coupons"
timeout_seconds: 15
pagination:
  style: query
  limit_param: per_page
  default_limit: 20
  max_limit: 50
response:
  items: coupons
access:
  surfaces:
    - staff
