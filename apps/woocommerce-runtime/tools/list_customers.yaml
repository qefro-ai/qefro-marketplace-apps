id: list_customers
description: "Staff-only customer list on the workspace HTTP connection"
connection: woocommerce
method: GET
path: "/wp-json/wc/v3/customers"
timeout_seconds: 15
pagination:
  style: query
  limit_param: per_page
  default_limit: 20
  max_limit: 50
response:
  items: $root
access:
  surfaces:
    - staff
