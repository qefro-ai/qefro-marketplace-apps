id: list_orders
description: "Staff-only shop-wide order list on the workspace HTTP connection"
connection: woocommerce
method: GET
path: "/wp-json/wc/v3/orders"
timeout_seconds: 15
pagination:
  style: query
  limit_param: per_page
  default_limit: 20
  max_limit: 50
response:
  items: orders
access:
  surfaces:
    - staff
