id: get-order
name: "Get my order"
description: "Look up one order for the authenticated Person"
trigger:
  type: conversation
steps:
  - id: ask_id
    type: ask
    field: id
    message: "What is the order id?"
  - id: run
    type: tool
    tool: get_my_order
    execution: http
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      Here is that order.
      {{items_text}}
  - id: done
    type: complete
    message: ""
