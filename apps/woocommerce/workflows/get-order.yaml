id: get-order
name: "Get my order"
description: "Look up one order for the authenticated Person"
trigger:
  type: conversation
steps:
  - id: list_orders
    type: tool
    tool: entity.order.list
    execution: runtime
    output: orders
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "🛒 Which order would you like to view?"
    choices_from: orders
    title_field: order_number
    value_field: id
    chip_prefix: order
  - id: run
    type: tool
    tool: get_my_order
    execution: http
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      🛒 **Order Details**
      {{items_text}}
  - id: done
    type: complete
    message: ""
