id: get-order
name: "Get my order"
description: "Look up one order for the authenticated Person"
surfaces:
- customer
trigger:
  type: conversation
steps:
  - id: list_orders
    type: tool
    tool: list_my_orders
    execution: http
    output: orders
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "📦 Which order would you like to view?"
    empty_message: "You have no orders to view right now."
    choices_from: orders
    title_field: number
    value_field: id
    chip_prefix: order
  - id: run
    type: tool
    tool: get_my_order
    execution: http
    input_map:
      id: id
  - id: confirm
    type: message
    message: |
      WooCommerce returned this order.
      {{items_text}}
  - id: done
    type: complete
    message: ""
