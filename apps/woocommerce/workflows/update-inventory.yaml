id: update-inventory
name: "Update inventory"
description: "Staff stock update through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: list_products
    type: tool
    tool: entity.product.list
    execution: runtime
    output: products
    input_map:
      limit: $literal:20
  - id: ask_id
    type: ask
    field: id
    message: "📊 Which product would you like to update?"
    choices_from: products
    title_field: name
    value_field: id
    chip_prefix: product
  - id: ask_stock_quantity
    type: ask
    field: stock_quantity
    message: "📊 What is the new stock quantity?"
  - id: run
    type: tool
    tool: update_inventory
    execution: http
    input_map:
      id: id
      stock_quantity: stock_quantity
  - id: confirm
    type: message
    message: "📊 Inventory updated for product {{id}}."
  - id: done
    type: complete
    message: ""
