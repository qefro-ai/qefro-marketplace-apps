id: zoho-crm-runtime
name: Zoho CRM
version: 0.1.2
hosting: runtime
description: Leads, contacts, accounts, deals, notes, and activities as a metadata
  Marketplace App
category: crm
tags:
- zoho
- crm
- runtime
channels:
- widget
- whatsapp
connections:
- zoho-crm
http_tools:
- list_leads
- get_lead
- create_lead
- list_contacts
- list_accounts
- list_deals
- create_deal
- create_note
- list_activities
entities:
- lead
- contact
- account
- deal
- note
- activity
flows:
- create-lead
- create-deal
- create-note
- list-deals
events:
- lead.created
- contact.created
- deal.created
- deal.updated
permissions:
- workflow.execute
- storage.read
- storage.write
- storage.update
- storage.delete
capabilities:
- theme.get
- user.get
- tenant.get
- runtime.query
- workflow.trigger
- storage.read
- storage.write
triggers:
- id: create_lead
  workflow: create-lead
  input_variable: lead_input
  match:
    intents:
    - create a lead
    - add a zoho lead
    confirmation:
      reply_signals:
      - lead created
      required_slots:
      - last_name
  confirmation_message: Lead created for {{last_name}}.
- id: create_deal
  workflow: create-deal
  input_variable: deal_input
  match:
    intents:
    - create a deal
    - add a zoho deal
    confirmation:
      reply_signals:
      - deal
      required_slots:
      - deal_name
  confirmation_message: Deal {{deal_name}} created.
- id: create_note
  workflow: create-note
  input_variable: note_input
  match:
    intents:
    - add a crm note
    - create a note
    confirmation:
      reply_signals:
      - note
      required_slots:
      - title
  confirmation_message: Note {{title}} created.
- id: list_deals
  workflow: list-deals
  input_variable: deal_list
  match:
    intents:
    - list deals
    - show zoho deals
    confirmation:
      reply_signals:
      - deals
      required_slots: []
  confirmation_message: Here are the recent deals.
conversation_slots:
- id: last_name
  labels:
  - last name
  - lead
  kind: string
- id: lead_email
  labels:
  - lead email
  kind: string
- id: company
  labels:
  - company
  - account
  kind: string
- id: deal_name
  labels:
  - deal
  - opportunity
  kind: string
- id: stage
  labels:
  - stage
  kind: string
- id: title
  labels:
  - title
  - note title
  kind: string
- id: body
  labels:
  - note
  - content
  kind: string
- id: parent_id
  labels:
  - parent
  - record id
  kind: string
ui:
  name: Zoho CRM
