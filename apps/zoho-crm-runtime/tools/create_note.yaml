id: create_note
description: "Staff-only create a note"
connection: zoho-crm
method: POST
path: "/crm/v2/Notes"
timeout_seconds: 15
body:
  data:
    - Note_Title: "{title}"
      Note_Content: "{body}"
      Parent_Id: "{parent_id}"
required_scopes:
  - ZohoCRM.modules.ALL
access:
  surfaces:
    - staff
