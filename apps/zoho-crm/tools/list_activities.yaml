id: list_activities
description: "Staff-only activities/events list"
connection: zoho-crm
method: GET
path: "/crm/v2/Events"
timeout_seconds: 15
pagination:
  style: query
  limit_param: limit
  default_limit: 20
  max_limit: 50
response:
  items: data
required_scopes:
  - ZohoCRM.modules.ALL
access:
  surfaces:
    - staff
