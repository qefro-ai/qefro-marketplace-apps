id: list_deals
description: "Staff-only deal list on the workspace HTTP connection"
connection: zoho-crm
method: GET
path: "/crm/v2/Deals"
timeout_seconds: 15
pagination:
  style: query
  limit_param: limit
  default_limit: 20
  max_limit: 50
response:
  items: data
required_scopes:
  - ZohoCRM.modules.ALL
access:
  surfaces:
    - staff
