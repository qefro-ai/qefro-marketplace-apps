- id: lead_form
  type: form
  title: New lead
  options:
    fields:
    - name: last_name
      label: Last name
      type: text
      required: true
    - name: lead_email
      label: Email
      type: text
      required: false
    - name: company
      label: Company
      type: text
      required: false
    submit_label: Create lead
    action:
      trigger: create-lead
- id: deals_status
  type: status
  title: Deals
  source: deals
  options:
    rows_path: items
    status_field: status
    label_field: deal_name
    empty_title: Nothing yet
- id: leads_table
  type: table
  title: Leads
  source: leads
  options:
    rows_path: items
    empty_title: No leads yet
    columns:
    - key: last_name
      header: Name
    - key: company
      header: Company
- id: contacts_table
  type: table
  title: Zoho contacts
  source: contacts
  options:
    rows_path: items
    empty_title: No zoho contacts yet
    columns:
    - key: name
      header: Name
    - key: email
      header: Email
- id: accounts_table
  type: table
  title: Accounts
  source: accounts
  options:
    rows_path: items
    empty_title: No accounts yet
    columns:
    - key: name
      header: Name
- id: deals_table
  type: table
  title: Deals
  source: deals
  options:
    rows_path: items
    empty_title: No deals yet
    columns:
    - key: deal_name
      header: Deal
    - key: stage
      header: Stage
- id: intro
  type: markdown
  title: Zoho CRM
  options:
    content: Zoho CRM — open a list and tap New to add records.
- id: metric_deal
  type: metric
  title: Deals
  source: deals
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: deals
- id: metric_lead
  type: metric
  title: Leads
  source: leads
  options:
    aggregate: count
    rows_path: items
    label: Total
    navigate_to: leads
- id: deal_dash_status
  type: status
  title: Deals status
  source: deals
  options:
    rows_path: items
    status_field: stage
    label_field: name
    empty_title: No deals yet
    empty_subtitle: Tap New on the list page to create the first record.
    navigate_to: deals
    action_label: View all
- id: deal_dash_table
  type: table
  title: Recent Deals
  source: deals
  options:
    rows_path: items
    limit: 8
    empty_title: No deals yet
    empty_subtitle: Open the list and tap New to add your first record.
    empty_action_label: Open list
    navigate_to: deals
    action_label: View all
    columns:
    - key: deal_name
      header: Deal Name
    - key: stage
      header: Stage
