id: create-note
name: "Create note"
description: "Create a Zoho note through generic Runtime HTTP"
trigger:
  type: conversation
steps:
  - id: ask_title
    type: ask
    field: title
    message: "📝 Note title?"
  - id: ask_body
    type: ask
    field: body
    message: "📝 Note content?"
  - id: ask_parent_id
    type: ask
    field: parent_id
    message: "📝 Parent record id?"
  - id: run
    type: tool
    tool: create_note
    execution: http
    input_map:
      title: title
      body: body
      parent_id: parent_id
  - id: confirm
    type: message
    message: "📝 Note {{title}} created."
  - id: done
    type: complete
    message: ""
